# Deploys the catalog to GitHub Pages on every push.
name: Deploy static content to Pages

on:
  # Deploys on every commit, on every branch.
  #
  # If this doesn't work — the run fails within a few seconds, with no
  # runner and no logs — GitHub is rejecting the deployment before this
  # workflow does anything. Two settings control that:
  #
  #   1. Settings → Pages → Source. If it's set to "Deploy from a branch",
  #      the deployment must come from that specific branch. Set it to
  #      "GitHub Actions".
  #   2. Settings → Environments → github-pages → Deployment branches. If a
  #      rule only allows the default branch, set it to "All branches".
  #
  # Pages has one live site, so the most recently pushed branch wins.
  push:

  # So it can also be started by hand from the Actions tab.
  workflow_dispatch:

# Just enough rights to deploy, and no more.
permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; queued runs drop, running ones finish.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    # Deliberately no `environment: github-pages`. That binding lets GitHub
    # check the deployment against that environment's branch rules, which
    # rejects every run from a branch other than the default within two
    # seconds, with no runner and no logs. Without the binding the job just
    # runs; the deployment itself goes through the Pages API using the
    # permissions above.
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      # Deliberately without `enablement: true`. That option lets the action
      # turn Pages on itself, but that's been tried and it can't: a
      # workflow's GITHUB_TOKEN isn't allowed to create a Pages site
      # ("Create Pages site failed: Resource not accessible by
      # integration"), since that needs admin rights on the repo. Turning on
      # Pages is therefore one-time manual work — see the note under `on:`
      # above — and without that step every run here fails.
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # The whole repo: the page needs atoms/ and vendor/.
          path: '.'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

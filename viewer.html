<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Modular Terrain — Walkthrough</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><text y='14' font-size='14'>⛰️</text></svg>">
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #1a2028; }
  canvas { width: 100%; height: 100%; display: block; touch-action: none; outline: none; }
  .hud {
    position: fixed; top: 12px; left: 12px; color: #dfe7ee; font: 13px/1.5 system-ui, sans-serif;
    background: rgba(20, 26, 34, 0.7); padding: 8px 12px; border-radius: 8px; pointer-events: none; max-width: 300px;
  }
  .bar {
    position: fixed; bottom: 16px; left: 50%; transform: translateX(-50%);
    display: flex; gap: 8px; background: rgba(20, 26, 34, 0.75); padding: 8px; border-radius: 14px;
  }
  .bar button {
    width: 48px; height: 48px; border: 0; border-radius: 10px; background: #2c3644; color: #eef4fa;
    font-size: 20px; cursor: pointer; touch-action: manipulation;
  }
  .bar button:active { background: #3e4c5e; }
</style>
</head>
<body>
<canvas id="view"></canvas>
<div class="hud" id="hud"><b>Walkthrough</b><br><small>Tap anywhere to walk there<br>
&#10226;&#10227; turn &middot; &#9650;&#9660; closer/wider &middot; all of it works while walking</small></div>
<div class="bar">
  <button id="rotL" title="Turn left">&#10226;</button>
  <button id="out" title="Wider">&#9650;</button>
  <button id="in" title="Closer">&#9660;</button>
  <button id="rotR" title="Turn right">&#10227;</button>
</div>
<script src="vendor/babylon/babylon.js"></script>
<script src="vendor/babylon/babylonjs.loaders.min.js"></script>
<script>
'use strict';
const SCENE = new URLSearchParams(location.search).get('scene') || 'Large_Island_v2_No_Ocean_No_Props';
const TAU = Math.PI * 2;
const HEADINGS = 6;                      // isometric, 60 apart
const SPEED = 6;                         // cells per second
const EYE = 3.6;                         // camera target above the floor
const VIEWS = [                          // pitch and distance move together
  { beta: 1.500, zoom: 0.18 }, { beta: 1.325, zoom: 0.34 }, { beta: 1.150, zoom: 0.64 },
  { beta: 0.975, zoom: 1.19 }, { beta: 0.800, zoom: 2.24 },
];

async function makeEngine(canvas) {
  if (navigator.gpu && BABYLON.WebGPUEngine) {
    try { const e = new BABYLON.WebGPUEngine(canvas, { antialias: true }); await e.initAsync(); return e; }
    catch (err) { console.warn('WebGPU unavailable, using WebGL', err); }
  }
  return new BABYLON.Engine(canvas, true);
}

(async () => {
  const canvas = document.getElementById('view');
  const [engine, grid] = await Promise.all([
    makeEngine(canvas),
    fetch(`scenes/${SCENE}_grid.json`).then((r) => r.json()),
  ]);
  const O = grid.meta.origin;
  // cells as world points, with their neighbours
  const cells = grid.cells.map(([c, r, y]) => ({ x: O.c + c + 0.5, y, z: O.r + r + 0.5, n: [] }));
  for (let i = 0; i < grid.edges.length; i += 2) {
    cells[grid.edges[i]].n.push(grid.edges[i + 1]);
    cells[grid.edges[i + 1]].n.push(grid.edges[i]);
  }

  const scene = new BABYLON.Scene(engine);
  scene.useRightHandedSystem = true;     // keep glTF's own coordinates
  scene.clearColor = BABYLON.Color4.FromHexString('#1a2028ff');
  await BABYLON.SceneLoader.AppendAsync('scenes/', `${SCENE}_merged.glb`, scene);
  for (const m of scene.meshes) m.freezeWorldMatrix();
  const sun = new BABYLON.DirectionalLight('sun', new BABYLON.Vector3(-0.5, -1, -0.35), scene);
  sun.intensity = 1.3;
  const sky = new BABYLON.HemisphericLight('sky', new BABYLON.Vector3(0, 1, 0), scene);
  sky.intensity = 1.2;
  sky.groundColor = new BABYLON.Color3(0.25, 0.22, 0.18);

  // --- one ray caster, used for the camera and for eye height ---------------
  const tris = [];
  for (const mesh of scene.meshes) {
    const pos = mesh.getVerticesData(BABYLON.VertexBuffer.PositionKind);
    if (!pos) continue;
    const idx = mesh.getIndices();
    const w = mesh.computeWorldMatrix(true);
    for (let t = 0; t < idx.length; t += 3) {
      const p = [0, 1, 2].map((k) => BABYLON.Vector3.TransformCoordinates(
        new BABYLON.Vector3(pos[idx[t + k] * 3], pos[idx[t + k] * 3 + 1], pos[idx[t + k] * 3 + 2]), w));
      tris.push([p[0].x, p[0].y, p[0].z, p[1].x, p[1].y, p[1].z, p[2].x, p[2].y, p[2].z]);
    }
  }
  const bins = new Map();
  const key = (x, z) => Math.floor(x) * 100000 + Math.floor(z);
  tris.forEach((t, i) => {
    for (let x = Math.floor(Math.min(t[0], t[3], t[6])); x <= Math.floor(Math.max(t[0], t[3], t[6])); x++)
      for (let z = Math.floor(Math.min(t[2], t[5], t[8])); z <= Math.floor(Math.max(t[2], t[5], t[8])); z++) {
        const k = x * 100000 + z, l = bins.get(k);
        if (l) l.push(i); else bins.set(k, [i]);
      }
  });
  function cast(ox, oy, oz, dx, dy, dz, far) {
    let best = far;
    const steps = Math.ceil(far) + 2;
    const seen = new Set();
    for (let s = 0; s <= steps; s++) {
      const f = (s / steps) * far;
      for (let a = -1; a <= 1; a++) for (let b = -1; b <= 1; b++) {
        const k = key(ox + dx * f + a, oz + dz * f + b);
        if (seen.has(k)) continue;
        seen.add(k);
        for (const i of bins.get(k) || []) {
          const [x0, y0, z0, x1, y1, z1, x2, y2, z2] = tris[i];
          const e1x = x1 - x0, e1y = y1 - y0, e1z = z1 - z0;
          const e2x = x2 - x0, e2y = y2 - y0, e2z = z2 - z0;
          const px = dy * e2z - dz * e2y, py = dz * e2x - dx * e2z, pz = dx * e2y - dy * e2x;
          const det = e1x * px + e1y * py + e1z * pz;
          if (Math.abs(det) < 1e-12) continue;
          const inv = 1 / det, tx = ox - x0, ty = oy - y0, tz = oz - z0;
          const u = (tx * px + ty * py + tz * pz) * inv;
          if (u < 0 || u > 1) continue;
          const qx = ty * e1z - tz * e1y, qy = tz * e1x - tx * e1z, qz = tx * e1y - ty * e1x;
          const v = (dx * qx + dy * qy + dz * qz) * inv;
          if (v < 0 || u + v > 1) continue;
          const hit = (e2x * qx + e2y * qy + e2z * qz) * inv;
          if (hit > 0.01 && hit < best) best = hit;
        }
      }
    }
    return best;
  }
  // In a cave the target ducks under the roof rather than sitting in it.
  const eyeAt = (p) => Math.min(EYE, cast(p.x, p.y + 0.2, p.z, 0, 1, 0, EYE + 1) - 0.6);

  // --- markers, one mesh per colour, drawn as thin instances ----------------
  const mat = (hex, alpha) => {
    const m = new BABYLON.StandardMaterial('m' + hex, scene);
    m.emissiveColor = BABYLON.Color3.FromHexString(hex);
    m.disableLighting = true;
    if (alpha) m.alpha = alpha;
    return m;
  };
  const pad = (material, top) => {
    const m = BABYLON.MeshBuilder.CreateCylinder('pad', { diameter: 0.7, height: 0.04, tessellation: 12 }, scene);
    m.material = material; m.isPickable = false; m.alwaysSelectAsActiveMesh = true;
    m.renderingGroupId = top ? 1 : 0; m.thinInstanceCount = 0;
    return m;
  };
  const pads = { field: pad(mat('#b9c8d6', 0.45), false), route: pad(mat('#ff9d47'), true), here: pad(mat('#7ee081'), true) };
  const bufs = {};
  function show(kind, list, scale) {
    const mesh = pads[kind];
    let b = bufs[kind];
    if (!b || b.length < list.length * 16) b = bufs[kind] = new Float32Array(Math.max(16, list.length * 32));
    list.forEach((i, k) => {
      const p = cells[i], o = k * 16;
      b.fill(0, o, o + 16);
      b[o] = b[o + 5] = b[o + 10] = scale; b[o + 15] = 1;
      b[o + 12] = p.x; b[o + 13] = p.y + 0.05; b[o + 14] = p.z;
    });
    mesh.thinInstanceSetBuffer('matrix', b, 16, false);
    mesh.thinInstanceCount = list.length;
    mesh.setEnabled(list.length > 0);
  }

  // --- where we are, and where we are going --------------------------------
  const mid = cells.reduce((a, c) => [a[0] + c.x, a[1] + c.z], [0, 0]).map((v) => v / cells.length);
  let at = cells.reduce((best, c, i) =>
    Math.hypot(c.x - mid[0], c.z - mid[1]) < Math.hypot(cells[best].x - mid[0], cells[best].z - mid[1]) ? i : best, 0);
  let path = [];        // cells still to walk through
  let pos = new BABYLON.Vector3(cells[at].x, cells[at].y, cells[at].z);
  let heading = 0, view = 1;

  const camera = new BABYLON.ArcRotateCamera('cam', 0, VIEWS[view].beta, 8, pos.clone(), scene);
  camera.minZ = 0.09; camera.maxZ = 1200; camera.fov = 0.9;
  camera.inputs.clear();

  function walkTo(dest) {
    const dist = new Float64Array(cells.length).fill(Infinity);
    const from = new Int32Array(cells.length).fill(-1);
    const heap = [[0, at]];
    dist[at] = 0;
    while (heap.length) {
      heap.sort((a, b) => a[0] - b[0]);
      const [d, n] = heap.shift();
      if (d > dist[n]) continue;
      if (n === dest) break;
      for (const m of cells[n].n) {
        const c = cells[n], e = cells[m];
        const w = Math.hypot(e.x - c.x, e.y - c.y, e.z - c.z);
        if (d + w < dist[m]) { dist[m] = d + w; from[m] = n; heap.push([d + w, m]); }
      }
    }
    if (dist[dest] === Infinity) return;
    path = [];
    for (let n = dest; n !== -1; n = from[n]) path.unshift(n);
    path.shift();
  }

  // --- one update per frame; nothing here interrupts anything else ---------
  scene.onBeforeRenderObservable.add(() => {
    const dt = Math.min(engine.getDeltaTime(), 50) / 1000;

    // walk: slide along the path at a steady speed, never stopping on a cell
    let budget = SPEED * dt;
    while (budget > 0 && path.length) {
      const next = cells[path[0]];
      const to = new BABYLON.Vector3(next.x, next.y, next.z);
      const gap = BABYLON.Vector3.Distance(pos, to);
      if (gap <= budget) { pos = to; at = path.shift(); budget -= gap; }
      else { pos = BABYLON.Vector3.Lerp(pos, to, budget / gap); budget = 0; }
    }

    // camera: each property eases toward what it should be, independently
    const want = VIEWS[view];
    const ease = (a, b, k) => a + (b - a) * Math.min(1, dt * k);
    const target = new BABYLON.Vector3(pos.x, pos.y + eyeAt(pos), pos.z);
    camera.target = BABYLON.Vector3.Lerp(camera.target, target, Math.min(1, dt * 12));
    let turn = heading * (TAU / HEADINGS) - camera.alpha;
    while (turn > Math.PI) turn -= TAU;
    while (turn < -Math.PI) turn += TAU;
    camera.alpha += turn * Math.min(1, dt * 6);
    camera.beta = ease(camera.beta, want.beta, 6);

    // the only thing that limits distance: what is actually in the way. A
    // camera is a volume, not a point, so the cast is a cylinder as wide as
    // the near plane's corners -- terrain beside the camera slices through
    // them even when nothing is on the centre line.
    const dx = Math.cos(camera.alpha) * Math.sin(camera.beta);
    const dy = Math.cos(camera.beta);
    const dz = Math.sin(camera.alpha) * Math.sin(camera.beta);
    const t = camera.target;
    const h = camera.minZ * Math.tan(camera.fov / 2);
    const wide = Math.hypot(h, h * engine.getAspectRatio(camera)) + 0.12;
    let ux = -dz, uz = dx;
    const ul = Math.hypot(ux, uz) || 1; ux /= ul; uz /= ul;
    const vx = dy * uz, vy = dz * ux - dx * uz, vz = -dy * ux;
    let room = cast(t.x, t.y, t.z, dx, dy, dz, 66);
    for (const [ox, oy, oz] of [[ux, 0, uz], [-ux, 0, -uz], [vx, vy, vz], [-vx, -vy, -vz]])
      room = Math.min(room, cast(t.x + ox * wide, t.y + oy * wide, t.z + oz * wide, dx, dy, dz, 66));
    room -= Math.hypot(camera.minZ, wide) * 1.3;
    // Eased so walls read as a pull-in, then hard-capped: easing toward the
    // free distance would leave the camera inside a wall for the frames the
    // easing takes.
    const cap = Math.max(0.3, room);
    camera.radius = Math.min(ease(camera.radius, Math.min(66 * want.zoom, cap), 8), cap);
  });

  // --- markers follow you ---------------------------------------------------
  let lastAt = -1;
  scene.onBeforeRenderObservable.add(() => {
    if (at === lastAt) { show('route', path.slice(0, 60), 1.2); return; }
    lastAt = at;
    const here = cells[at];
    const near = [];
    for (let i = 0; i < cells.length; i++) {
      const c = cells[i];
      if (Math.abs(c.x - here.x) < 16 && Math.abs(c.z - here.z) < 16 && Math.abs(c.y - here.y) < 6) near.push(i);
    }
    show('field', near, 0.6);
    show('here', [at], 1.3);
  });

  // --- input ----------------------------------------------------------------
  let down = null;
  scene.onPointerObservable.add((info) => {
    const e = info.event;
    if (info.type === BABYLON.PointerEventTypes.POINTERDOWN) { down = { x: e.clientX, y: e.clientY }; return; }
    if (info.type !== BABYLON.PointerEventTypes.POINTERUP || !down) return;
    const dx = e.clientX - down.x, dy = e.clientY - down.y;
    down = null;
    if (Math.abs(dx) > 40 && Math.abs(dx) > Math.abs(dy)) { heading += dx > 0 ? -1 : 1; return; }
    if (Math.abs(dy) > 40) { view = Math.max(0, Math.min(VIEWS.length - 1, view + (dy > 0 ? -1 : 1))); return; }
    const hit = scene.pick(e.clientX, e.clientY, (m) => m.name !== 'pad');
    if (!hit?.hit) return;
    const p = hit.pickedPoint;
    let best = -1, bestD = Infinity;
    for (let i = 0; i < cells.length; i++) {
      const c = cells[i];
      const d = Math.hypot(c.x - p.x, (c.y - p.y) * 2, c.z - p.z);
      if (d < bestD) { bestD = d; best = i; }
    }
    if (best >= 0) walkTo(best);
  });
  const bind = (id, fn) => document.getElementById(id).addEventListener('click', fn);
  bind('rotL', () => heading++); bind('rotR', () => heading--);
  bind('out', () => { view = Math.min(VIEWS.length - 1, view + 1); });
  bind('in', () => { view = Math.max(0, view - 1); });
  addEventListener('keydown', (e) => {
    if (e.key === 'ArrowLeft') heading++;
    if (e.key === 'ArrowRight') heading--;
    if (e.key === 'PageUp') view = Math.min(VIEWS.length - 1, view + 1);
    if (e.key === 'PageDown') view = Math.max(0, view - 1);
  });

  engine.runRenderLoop(() => scene.render());
  addEventListener('resize', () => engine.resize());
})().catch((e) => {
  document.getElementById('hud').innerHTML = `<b>Failed to load</b><br><small>${e.message}</small>`;
  throw e;
});
</script>
</body>
</html>

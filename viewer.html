<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Modular Terrain — Walkthrough</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><text y='14' font-size='14'>⛰️</text></svg>">
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #1a2028; }
  canvas { width: 100%; height: 100%; display: block; touch-action: none; outline: none; }
  .hud {
    position: fixed; top: 12px; left: 12px; color: #dfe7ee; font: 13px/1.5 system-ui, sans-serif;
    background: rgba(20, 26, 34, 0.7); padding: 8px 12px; border-radius: 8px; pointer-events: none;
    max-width: 300px;
  }
  .hud b { font-size: 14px; }
  .hud small { opacity: 0.75; }
  .hud .ver { display: block; margin-top: 6px; opacity: 0.45; font-size: 11px; }
  .hud .dbg { display: block; font: 11px/1.45 ui-monospace, SFMono-Regular, Menlo, monospace; opacity: 0.85; }
  .hud .dbg i { font-style: normal; opacity: 0.55; }
  .bar {
    position: fixed; bottom: 16px; left: 50%; transform: translateX(-50%);
    display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; max-width: calc(100vw - 24px);
    background: rgba(20, 26, 34, 0.75); padding: 8px; border-radius: 14px;
  }
  .bar button {
    width: 48px; height: 48px; border: 0; border-radius: 10px; background: #2c3644; color: #eef4fa;
    font-size: 20px; cursor: pointer; touch-action: manipulation;
  }
  .bar button:active { background: #3e4c5e; }
  .bar button.on { background: #7a5c1e; }
</style>
</head>
<body>
<canvas id="view"></canvas>
<div class="hud" id="hud"></div>
<div class="bar">
  <button id="back" title="Back to where you came from (Backspace)" disabled>&#8617;</button>
  <button id="rotL" title="Orbit left (&#8592;)">&#10226;</button>
  <button id="tiltU" title="Wider, higher view">&#9650;</button>
  <button id="tiltD" title="Closer, lower view">&#9660;</button>
  <button id="rotR" title="Orbit right (&#8594;)">&#10227;</button>
  <button id="edit" title="Review the walkable grid (E)">&#9998;</button>
  <button id="dbg" title="Collision rays (D)" class="on">&#9788;</button>
  <button id="path" title="Record a path: tap start, then end (P)" hidden>&#8618;</button>
  <button id="draw" title="Draw marks, or move the camera" hidden>&#9995;</button>
  <button id="kind" title="What a mark means: add, wrong, mark" hidden>+</button>
  <button id="undo" title="Undo last mark (Z)" hidden>&#8634;</button>
  <button id="pin" title="Pin this view: node, orbit, tilt and zoom" hidden>&#128204;</button>
  <button id="save" title="Download the review JSON" hidden>&#128190;</button>
</div>
<script src="vendor/babylon/babylon.js"></script>
<script src="vendor/babylon/babylonjs.loaders.min.js"></script>
<script type="module">
import { buildIndex, raycast as castRay } from './tools/lib/ray.mjs';
import { isSeeThrough } from './tools/lib/see-through.mjs';

const VIEWER_VERSION = '1.0.0';
const SCENE = new URLSearchParams(location.search).get('scene') || 'Large_Island_v2_No_Ocean_No_Props';
const canvas = document.getElementById('view');
const hud = document.getElementById('hud');

const TAU = Math.PI * 2;
const STEPS = 8;
const STEP_ANGLE = TAU / STEPS;
const MAP_VIEW = { beta: 0.26, zoom: 0.55 };
const VIEWS = [
  { beta: 1.435, far: 4 },
  { beta: 1.365, far: 8 },
  { beta: 1.204, far: 16 },
  { beta: 1.029, far: 32 },
  { beta: 0.855, far: 64 },
];
const LEVEL = 1.55;
const BACK = 1.6;
const RATE = 9;
const smooth = (t) => t * t * (3 - 2 * t);

function damped(v, rate) {
  return {
    v, rate, easing: null,
    ease(ms) { if (this.v !== null) this.easing = { t0: performance.now(), ms, from: this.v }; },
    step(target, dt, rate = this.rate) {
      if (this.v === null) { this.v = target; this.easing = null; return this.v; }
      if (this.easing) {
        const t = Math.min((performance.now() - this.easing.t0) / this.easing.ms, 1);
        this.v = this.easing.from + (target - this.easing.from) * smooth(t);
        if (t === 1) this.easing = null;
      } else {
        const d = rate * dt;
        this.v += Math.max(-d, Math.min(d, target - this.v));
      }
      return this.v;
    },
  };
}

const buildStamp = (iso) => {
  const d = new Date(iso);
  return Number.isNaN(d.getTime()) ? String(iso) : d.toISOString().slice(0, 16).replace('T', ' ') + 'Z';
};
const deg = (r) => (((r * 180) / Math.PI) % 360).toFixed(0);
const num = (v, d = 2) => (Number.isFinite(v) ? v.toFixed(d) : '\u221e');

async function makeEngine() {
  if (navigator.gpu && BABYLON.WebGPUEngine) {
    try {
      const engine = new BABYLON.WebGPUEngine(canvas, { antialias: true });
      await engine.initAsync();
      return engine;
    } catch (e) { console.warn('WebGPU unavailable, falling back to WebGL', e); }
  }
  return new BABYLON.Engine(canvas, true);
}

function fromGrid(grid) {
  const { origin, materials, path } = grid.meta;
  const nodes = grid.nodes.map(([c, r, y, m, dx = 0, dz = 0]) => ({
    c, r,
    p: [origin.c + c + 0.5 + dx, y, origin.r + r + 0.5 + dz],
    s: path[m] ? 'p' : 'g',
    n: [],
  }));
  for (let i = 0; i < grid.edges.length; i += 2) {
    nodes[grid.edges[i]].n.push(grid.edges[i + 1]);
    nodes[grid.edges[i + 1]].n.push(grid.edges[i]);
  }
  return { meta: grid.meta, nodes, materials };
}

(async () => {
  const [engine, grid] = await Promise.all([
    makeEngine(),
    fetch(`models/scenes/${SCENE}_grid2.json`).then((r) => r.json()),
  ]);
  const nav = fromGrid(grid);
  const VERSION_LINE = () => {
    const g = nav.meta.version ? `grid ${nav.meta.version}` : 'grid unversioned';
    const b = nav.meta.built ? ` &middot; built ${buildStamp(nav.meta.built)}` : '';
    return `<small class="ver">viewer ${VIEWER_VERSION} &middot; ${g}${b}</small>`;
  };
  const { eye, cell } = nav.meta;
  const scene = new BABYLON.Scene(engine);
  scene.useRightHandedSystem = true;
  scene.clearColor = BABYLON.Color4.FromHexString('#1a2028ff');

  await BABYLON.SceneLoader.AppendAsync('models/scenes/', `${SCENE}_merged.glb`, scene);
  const terrain = scene.meshes.filter((m) => m.getTotalVertices() > 0 && !isSeeThrough(m.name));
  for (const mesh of scene.meshes) mesh.freezeWorldMatrix();

  const sun = new BABYLON.DirectionalLight('sun', new BABYLON.Vector3(-0.5, -1, -0.35), scene);
  sun.intensity = 1.3;
  const sky = new BABYLON.HemisphericLight('sky', new BABYLON.Vector3(0, 1, 0), scene);
  sky.intensity = 1.2;
  sky.groundColor = new BABYLON.Color3(0.25, 0.22, 0.18);

  const index = buildIndex((() => {
    const parts = [];
    let total = 0;
    for (const mesh of terrain) {
      mesh.computeWorldMatrix(true);
      const wm = mesh.getWorldMatrix();
      const src = mesh.getVerticesData(BABYLON.VertexBuffer.PositionKind);
      const out = new Float32Array(src.length);
      const v = new BABYLON.Vector3();
      for (let i = 0; i < src.length; i += 3) {
        BABYLON.Vector3.TransformCoordinatesFromFloatsToRef(src[i], src[i + 1], src[i + 2], wm, v);
        out[i] = v.x; out[i + 1] = v.y; out[i + 2] = v.z;
      }
      parts.push(out);
      total += out.length;
    }
    const all = new Float32Array(total);
    let o = 0;
    for (const a of parts) { all.set(a, o); o += a.length; }
    return all;
  })(), cell);
  const raycast = (ox, oy, oz, dx, dy, dz, tMax) => castRay(index, ox, oy, oz, dx, dy, dz, tMax);

  const centroid = nav.nodes.reduce((a, n) => [a[0] + n.p[0], a[1] + n.p[2]], [0, 0]).map((v) => v / nav.nodes.length);
  const startScore = (n) => Math.hypot(n.p[0] - centroid[0], n.p[2] - centroid[1]) + (n.s === 'p' ? 0 : 30);
  const mainPatch = nav.meta.main ?? nav.nodes.length;
  const start = (() => {
    const order = nav.nodes.map((n, i) => i)
      .filter((i) => i < mainPatch)
      .sort((a, b) => startScore(nav.nodes[a]) - startScore(nav.nodes[b]));
    for (const i of order.slice(0, 400)) {
      const p = nav.nodes[i].p;
      if (raycast(p[0], p[1] + eye, p[2], 0, 1, 0, 80) === Infinity) return i;
    }
    return order[0];
  })();

  const asked = parseInt(new URLSearchParams(location.search).get('node') ?? '', 10);
  let cur = Number.isInteger(asked) && asked >= 0 && asked < nav.nodes.length ? asked : start;
  let stepCont = 0;
  let viewIdx = 1;
  let debugRays = true;
  const planSegs = [];
  const castSegs = [];
  const fanSegs = [];
  const dropSegs = [];
  let mapView = false;
  let mapZoom = 0.55;
  const view = () => (mapView ? MAP_VIEW : VIEWS[viewIdx]);
  const maxR = 66, margin = 0.3;
  const step = () => ((Math.round(stepCont) % STEPS) + STEPS) % STEPS;
  const eyePoint = (n) => new BABYLON.Vector3(nav.nodes[n].p[0], nav.nodes[n].p[1] + eye, nav.nodes[n].p[2]);
  const dirAt = (alpha, beta) => [Math.cos(alpha) * Math.sin(beta), Math.cos(beta), Math.sin(alpha) * Math.sin(beta)];

  function nearRadius() {
    const h = camera.minZ * Math.tan(camera.fov / 2);
    return Math.hypot(h, h * engine.getAspectRatio(camera)) + 0.12;
  }
  const perp = (dx, dy, dz) => {
    const ax = Math.abs(dy) < 0.9 ? [0, 1, 0] : [1, 0, 0];
    let ux = ax[1] * dz - ax[2] * dy, uy = ax[2] * dx - ax[0] * dz, uz = ax[0] * dy - ax[1] * dx;
    const ul = Math.hypot(ux, uy, uz) || 1;
    ux /= ul; uy /= ul; uz /= ul;
    return [[ux, uy, uz], [dy * uz - dz * uy, dz * ux - dx * uz, dx * uy - dy * ux]];
  };
  function thickCast(ox, oy, oz, dx, dy, dz, tMax, probe, out) {
    let best = raycast(ox, oy, oz, dx, dy, dz, tMax);
    if (out) out.push([ox, oy, oz, dx, dy, dz, best, tMax]);
    const [u, v] = perp(dx, dy, dz);
    for (const [sx, sy, sz] of [u, v, [-u[0], -u[1], -u[2]], [-v[0], -v[1], -v[2]]]) {
      const hit = raycast(ox + sx * probe, oy + sy * probe, oz + sz * probe, dx, dy, dz, tMax);
      if (out) out.push([ox + sx * probe, oy + sy * probe, oz + sz * probe, dx, dy, dz, hit, tMax]);
      if (hit < best) best = hit;
    }
    return best;
  }

  function roomAt(n, k, beta, out) {
    const p = nav.nodes[n].p;
    const [dx, dy, dz] = dirAt(k * STEP_ANGLE, beta);
    return Math.min(maxR, thickCast(p[0], p[1] + eye, p[2], dx, dy, dz, maxR + margin, nearRadius(), out) - margin);
  }
  function fitBeta(n, k) {
    const want = view().beta;
    for (let b = want; b <= LEVEL + 1e-6; b += 0.09) if (roomAt(n, k, b) >= BACK) return b;
    return LEVEL;
  }
  function plan() {
    const beta = fitBeta(cur, step());
    planSegs.length = 0;
    return { beta, radius: Math.min(view().far, roomAt(cur, step(), beta, debugRays ? planSegs : null)) };
  }
  const open = (n, k) => roomAt(n, ((k % STEPS) + STEPS) % STEPS, view().beta) > BACK;

  const camera = new BABYLON.ArcRotateCamera('cam', 0, view().beta, 1, eyePoint(start), scene);
  camera.minZ = 0.09;
  camera.maxZ = 1200;
  camera.fov = (75 * Math.PI) / 180;
  camera.inputs.clear();

  const avatar = BABYLON.MeshBuilder.CreateBox('avatar', { size: 0.5 }, scene);
  avatar.isPickable = false;
  const avatarMat = new BABYLON.StandardMaterial('avatarMat', scene);
  avatarMat.emissiveColor = BABYLON.Color3.FromHexString('#2e8cff');
  avatarMat.disableLighting = true;
  avatarMat.alpha = 0.55;
  avatar.material = avatarMat;
  avatar.enableEdgesRendering();
  avatar.edgesWidth = 3;
  avatar.edgesColor = new BABYLON.Color4(0.05, 0.25, 0.7, 1);

  let tween = null;
  const held = damped(null, RATE), heldBeta = damped(null, 2);
  let route = [];
  const history = [];
  let recording = true;
  function pushHistory(from) {
    if (history[history.length - 1] === from) return;
    history.push(from);
    if (history.length > 60) history.shift();
    const b = document.getElementById('back');
    if (b) b.disabled = false;
  }
  function goBack() {
    if (!history.length) return;
    route = [];
    const to = history.pop();
    const b = document.getElementById('back');
    if (b) b.disabled = !history.length;
    recording = false;
    stepCont = headingNear(to, Math.round(stepCont)) ?? Math.round(stepCont);
    glideTo(to, 420);
    recording = true;
  }
  function glideTo(node, ms) {
    if (recording && cur !== node) pushHistory(cur);
    cur = node;
    renderHud();
    tween = {
      t0: performance.now(), ms,
      aT0: performance.now(), aMs: ms,
      target0: camera.target.clone(), target1: eyePoint(node),
      ground0: camera.target.y - eye, ground1: nav.nodes[node].p[1],
      alpha0: camera.alpha, alpha1: stepCont * STEP_ANGLE,
    };
    updateMarkers();
  }
  scene.onBeforeRenderObservable.add(() => {
    const dt = Math.min(engine.getDeltaTime(), 50) / 1000;
    if (tween) {
      const t = Math.min((performance.now() - tween.t0) / tween.ms, 1);
      const s = smooth(t);
      camera.target = BABYLON.Vector3.Lerp(tween.target0, tween.target1, s);
      camera.target.y = tween.ground0 + (tween.ground1 - tween.ground0) * s + eye;
      const sa = smooth(Math.min((performance.now() - tween.aT0) / tween.aMs, 1));
      camera.alpha = tween.alpha0 + (tween.alpha1 - tween.alpha0) * sa;
      if (t === 1) {
        tween = null;
        if (route.length) { const nxt = route.shift(); glideFacing(nxt, legMs(cur, nxt)); } else updateMarkers();
      }
    }
    if (mapView) {
      camera.beta += (MAP_VIEW.beta - camera.beta) * Math.min(1, dt * 6);
      const want = Math.max(2.4, maxR * mapZoom);
      camera.radius += (want - camera.radius) * Math.min(1, dt * 6);
      if (!tween) {
        const b = nav.nodes[cur].p;
        camera.target.set(b[0] + pan.x, b[1] + eye, b[2] + pan.z);
      }
      held.v = heldBeta.v = null;
      castSegs.length = 0;
      planSegs.length = 0;
      return;
    }
    const want = plan();
    const rate = RATE + view().far;
    camera.beta = heldBeta.step(want.beta, dt);
    const back = held.step(want.radius, dt, rate);
    if (!tween) camera.target.y = nav.nodes[cur].p[1] + eye;
    const [dx, dy, dz] = dirAt(camera.alpha, camera.beta);
    const probe = nearRadius();
    castSegs.length = 0;
    const room = thickCast(camera.target.x, camera.target.y, camera.target.z, dx, dy, dz, back + margin, probe,
      debugRays ? castSegs : null) - Math.hypot(camera.minZ, probe) * 1.3;
    camera.radius = Math.max(0, Math.min(back, room));
    held.v = Math.min(held.v, camera.radius + rate * dt);
  });

  scene.onBeforeRenderObservable.add(() => {
    avatar.position.set(camera.target.x, Math.floor(camera.target.y - eye + 0.02) + 0.75, camera.target.z);
  });

  let rayMesh = null;
  const HIT = new BABYLON.Color4(1, 0.35, 0.35, 0.95);
  const GROUPS = [
    { segs: castSegs, from: new BABYLON.Color4(0.35, 0.95, 0.55, 0.5), miss: new BABYLON.Color4(0.35, 0.95, 0.55, 0.5) },
    { segs: planSegs, from: new BABYLON.Color4(1, 0.72, 0.25, 0.8), miss: new BABYLON.Color4(1, 0.72, 0.25, 0.5) },
    { segs: fanSegs, from: new BABYLON.Color4(0.45, 0.75, 1, 0.55), miss: new BABYLON.Color4(0.45, 0.75, 1, 0.3) },
    { segs: dropSegs, drop: true, from: new BABYLON.Color4(1, 0.4, 0.95, 0.95), miss: new BABYLON.Color4(1, 0.4, 0.95, 0.5) },
  ];
  const rayCount = () => GROUPS.reduce((n, g) => n + g.segs.length, 0);
  function drawRays() {
    if (!debugRays || editMode || !rayCount()) { if (rayMesh) rayMesh.setEnabled(false); return; }
    const lines = [], colors = [];
    for (const g of GROUPS) {
      for (const [ox, oy, oz, dx, dy, dz, t, tMax] of g.segs) {
        const len = Math.min(Number.isFinite(t) ? t : tMax, tMax);
        lines.push([new BABYLON.Vector3(ox, oy, oz),
          new BABYLON.Vector3(ox + dx * len, oy + dy * len, oz + dz * len)]);
        colors.push([g.from, Number.isFinite(t) ? HIT : g.miss]);
      }
    }
    const same = rayMesh && rayMesh.rayCount === lines.length;
    rayMesh = BABYLON.MeshBuilder.CreateLineSystem('rays',
      { lines, colors, updatable: true, instance: same ? rayMesh : null }, scene);
    if (!same) {
      rayMesh.rayCount = lines.length;
      rayMesh.isPickable = false;
      rayMesh.alwaysSelectAsActiveMesh = true;
      rayMesh.renderingGroupId = 1;
    }
    rayMesh.setEnabled(true);
  }
  const DROP = 16;
  function castDrop() {
    dropSegs.length = 0;
    if (!debugRays || editMode) return;
    const a = avatar.position;
    dropSegs.push([a.x, a.y, a.z, 0, -1, 0, raycast(a.x, a.y, a.z, 0, -1, 0, DROP), DROP]);
  }
  function castFan() {
    fanSegs.length = 0;
    if (!debugRays || editMode) return;
    const beta = mapView ? VIEWS[viewIdx].beta : camera.beta;
    for (let k = 0; k < STEPS; k++) roomAt(cur, k, beta, fanSegs);
  }

  let hudAt = 0;
  scene.onBeforeRenderObservable.add(() => {
    castDrop();
    if (performance.now() - hudAt >= 120) {
      hudAt = performance.now();
      castFan();
      renderHud();
    }
    drawRays();
  });

  const dist3 = (a, b) => Math.hypot(b.p[0] - a.p[0], b.p[1] - a.p[1], b.p[2] - a.p[2]);
  const surf = { p: 1, g: 3.5 };
  const edgeCost = (a, b) => dist3(nav.nodes[a], nav.nodes[b]) * (((surf[nav.nodes[a].s] || 2) + (surf[nav.nodes[b].s] || 2)) / 2);
  const legMs = (a, b) => Math.min(400, Math.max(150, dist3(nav.nodes[a], nav.nodes[b]) * 150));
  let byCell = new Map();
  const cellKey = (c, r) => c * 100000 + r;
  function indexCells() {
    byCell = new Map();
    nav.nodes.forEach((n, i) => {
      const k = cellKey(n.c, n.r);
      if (!byCell.has(k)) byCell.set(k, []);
      byCell.get(k).push(i);
    });
  }
  indexCells();
  function dijkstra(from, dest) {
    const dist = new Float64Array(nav.nodes.length).fill(Infinity);
    const prev = new Int32Array(nav.nodes.length).fill(-1);
    const done = new Uint8Array(nav.nodes.length);
    const heap = [];
    const push = (cost, node) => {
      heap.push([cost, node]);
      let i = heap.length - 1;
      while (i > 0) {
        const p = (i - 1) >> 1;
        if (heap[p][0] <= heap[i][0]) break;
        [heap[p], heap[i]] = [heap[i], heap[p]];
        i = p;
      }
    };
    const pop = () => {
      const top = heap[0], last = heap.pop();
      if (heap.length) {
        heap[0] = last;
        let i = 0;
        for (;;) {
          const l = i * 2 + 1, r = l + 1;
          let m = i;
          if (l < heap.length && heap[l][0] < heap[m][0]) m = l;
          if (r < heap.length && heap[r][0] < heap[m][0]) m = r;
          if (m === i) break;
          [heap[m], heap[i]] = [heap[i], heap[m]];
          i = m;
        }
      }
      return top;
    };
    dist[from] = 0;
    push(0, from);
    while (heap.length) {
      const [, n] = pop();
      if (done[n]) continue;
      done[n] = 1;
      if (n === dest) break;
      for (const nb of nav.nodes[n].n) {
        const d = dist[n] + edgeCost(n, nb);
        if (d < dist[nb]) { dist[nb] = d; prev[nb] = n; push(d, nb); }
      }
    }
    return { dist, prev };
  }
  function stepsBetween(from, dest) {
    if (from === dest) return 0;
    const { dist, prev } = dijkstra(from, dest);
    if (dist[dest] === Infinity) return null;
    let steps = 0;
    for (let n = dest; n !== from && n !== -1; n = prev[n]) steps++;
    return steps;
  }
  function travelTo(dest) {
    if (dest === cur) return;
    const { dist, prev } = dijkstra(cur, dest);
    if (dist[dest] === Infinity) {
      const to = nav.nodes[dest].p;
      let best = -1, bestD = Infinity;
      for (let i = 0; i < nav.nodes.length; i++) {
        if (dist[i] === Infinity) continue;
        const p = nav.nodes[i].p;
        const d = Math.hypot(p[0] - to[0], p[1] - to[1], p[2] - to[2]);
        if (d < bestD) { bestD = d; best = i; }
      }
      if (best < 0 || best === cur) { route = []; return; }
      dest = best;
    }
    route = [];
    for (let n = dest; n !== -1; n = prev[n]) route.unshift(n);
    route.shift();
    if (route.length) { const nxt = route.shift(); glideFacing(nxt, legMs(cur, nxt)); }
  }
  const TAP_PX = 32;
  function markerAtScreen(px, py) {
    const eng = engine;
    const vp = camera.viewport.toGlobal(eng.getRenderWidth(), eng.getRenderHeight());
    const xform = scene.getTransformMatrix();
    const ident = BABYLON.Matrix.Identity();

    pathMode = on;
    selected = -1;
    if (on && !drawing) setDrawing(true);
    document.getElementById('path').classList.toggle('on', on);
    updateMarkers();
  }

  let down = null;
  scene.onPointerObservable.add((info) => {
    if (drawing) return;
    const e = info.event;
    if (info.type === BABYLON.PointerEventTypes.POINTERDOWN) down = { x: e.clientX, y: e.clientY };
    if (info.type !== BABYLON.PointerEventTypes.POINTERUP || !down) return;
    if (multiTouch) { down = null; return; }
    const dx = e.clientX - down.x, dy = e.clientY - down.y;
    down = null;
    if (Math.hypot(dx, dy) < 40) {
      if (editMode) return;
      const tapped = markerAtScreen(scene.pointerX, scene.pointerY);
      if (tapped >= 0) return travelTo(tapped);
      const ground = scene.pick(scene.pointerX, scene.pointerY);
      if (ground?.hit) travelTo(nearestNode(ground.pickedPoint));
    } else if (Math.abs(dx) > Math.abs(dy)) {
      orbit(dx > 0 ? -1 : 1);
    } else {
      setView(dy > 0 ? 1 : -1);
    }
  });
  const CANCEL_PX = 12;
  const touches = new Map();
  let stroke = null;
  let press = null;
  let gesture = null;
  let multiTouch = false;
  const renderXY = (e) => {
    const rect = canvas.getBoundingClientRect();
    return [(e.clientX - rect.left) * (engine.getRenderWidth() / (rect.width || 1)),
      (e.clientY - rect.top) * (engine.getRenderHeight() / (rect.height || 1))];
  };
  const pxScale = () => engine.getRenderHeight() / (canvas.getBoundingClientRect().height || 1);
  function clampPan() {
    const b = nav.nodes[cur].p, size = nav.meta.size, o = O();
    pan.x = Math.min(o.c + size.cols + 2, Math.max(o.c - 2, b[0] + pan.x)) - b[0];
    pan.z = Math.min(o.r + size.rows + 2, Math.max(o.r - 2, b[2] + pan.z)) - b[2];
  }
  function panBy(dx, dy) {
    const wpp = (2 * Math.max(camera.radius, 1) * Math.tan(camera.fov / 2)) / engine.getRenderHeight();
    const right = camera.getDirection(BABYLON.Axis.X);
    const up = camera.getDirection(BABYLON.Axis.Y);
    if (Math.hypot(up.x, up.z) < 1e-3) up.copyFrom(camera.getDirection(BABYLON.Axis.Z).scale(-1));
    right.y = 0; up.y = 0;
    right.normalize(); up.normalize();
    pan.x -= (right.x * dx - up.x * dy) * wpp;
    pan.z -= (right.z * dx - up.z * dy) * wpp;
    clampPan();
    needMarkers();
  }
  const strokeKey = (cell) => `${cell.c},${cell.r},${Math.round(cell.y * 2)}`;
  function aimLink(sx, sy) {
    const from = press.cell;
    if (!from) return;
    const at = pickCell(sx, sy);
    if (!at) return;
    const dc = Math.max(-1, Math.min(1, at.c - from.c));
    const dr = Math.max(-1, Math.min(1, at.r - from.r));
    const to = dc || dr ? (touching(from, at) ? at : cellAt(from.c + dc, from.r + dr, from.y)) : null;
    linkDrag = { from, to };
    needMarkers();
  }
  function dropLink() {
    const drag = linkDrag;
    linkDrag = null;
    if (!drag?.to) { updateMarkers(); return; }
    pushUndo();
    const k = linkKey(cellRefOf(drag.from), cellRefOf(drag.to));
    if (marks.links.has(k)) marks.links.delete(k);
    else setLink(drag.from, drag.to, true);
    updateMarkers();
  }
  function paintCell(cell) {
    if (stroke.seen.has(strokeKey(cell))) return;
    stroke.seen.add(strokeKey(cell));
    setMark(cell, stroke.on);
    needMarkers();
  }
  function beginStroke(cell, sx, sy) {
    pushUndo();
    stroke = { on: !markAt(cell), seen: new Set(), sx, sy };
    paintCell(cell);
  }
  const PAINT_STEP = 9;
  function paintTo(sx, sy) {
    const n = Math.max(1, Math.ceil(Math.hypot(sx - stroke.sx, sy - stroke.sy) / PAINT_STEP));
    for (let i = 1; i <= n; i++) {
      const cell = pickCell(stroke.sx + ((sx - stroke.sx) * i) / n, stroke.sy + ((sy - stroke.sy) * i) / n);
      if (cell) paintCell(cell);
    }
    stroke.sx = sx; stroke.sy = sy;
  }
  function tapCell(cell) {
    if (mode() === 'line') return;
    pushUndo();
    setMark(cell, !markAt(cell));
    needMarkers();
  }
  function pathTap(cell) {
    let i = cell.node;
    if (i < 0) i = nearestNode(new BABYLON.Vector3(cell.x, cell.y, cell.z));
    if (i < 0) return;
    if (selected === -1) selected = i;
    else if (selected === i) selected = -1;
    else { recordPath(selected, i); selected = -1; }
    updateMarkers();
  }
  const endTouch = (id) => {
    touches.delete(id);
    if (touches.size < 2) gesture = null;
  };
  canvas.addEventListener('pointerdown', (e) => {
    if (!editMode) return;
    touches.set(e.pointerId, { x: e.clientX, y: e.clientY });
    if (touches.size === 2) {
      multiTouch = true;
      if (stroke) { stroke = null; undo(); }
      press = null;
      linkDrag = null;
      const [a, b] = [...touches.values()];
      gesture = { x: (a.x + b.x) / 2, y: (a.y + b.y) / 2 };
      updateMarkers();
      return;
    }
    if (touches.size > 2 || !drawing) return;
    if (press && !touches.has(press.id)) { press = null; stroke = null; }
    const [sx, sy] = renderXY(e);
    press = { id: e.pointerId, x: e.clientX, y: e.clientY, sx, sy, cell: pickCell(sx, sy) };
  });
  addEventListener('pointermove', (e) => {
    if (!editMode) return;
    const t = touches.get(e.pointerId);
    if (!t) return;
    t.x = e.clientX; t.y = e.clientY;
    if (touches.size >= 2) {
      if (!gesture || touches.size !== 2) return;
      const [a, b] = [...touches.values()];
      const cx = (a.x + b.x) / 2, cy = (a.y + b.y) / 2;
      const s = pxScale();
      panBy((cx - gesture.x) * s, (cy - gesture.y) * s);
      gesture = { x: cx, y: cy };
      return;
    }
    if (!press || press.id !== e.pointerId) return;
    const [sx, sy] = renderXY(e);
    if (Math.hypot(e.clientX - press.x, e.clientY - press.y) < CANCEL_PX) return;
    if (pathMode) return;
    if (mode() === 'line') { aimLink(sx, sy); return; }
    if (!stroke) {
      const cell = press.cell ?? pickCell(sx, sy);
      if (!cell) return;
      beginStroke(cell, press.sx, press.sy);
    }
    paintTo(sx, sy);
  });
  addEventListener('pointerup', (e) => {
    const mine = press && press.id === e.pointerId ? press : null;
    endTouch(e.pointerId);
    if (!touches.size) multiTouch = false;
    if (!editMode || !mine) return;
    press = null;
    const [sx, sy] = renderXY(e);
    if (mode() === 'line') { dropLink(); return; }
    if (stroke) { stroke = null; updateMarkers(); return; }
    const swiped = Math.hypot(e.clientX - mine.x, e.clientY - mine.y) >= CANCEL_PX;
    const cell = mine.cell ?? pickCell(sx, sy);
    if (!cell) return;
    if (pathMode) { if (!swiped) pathTap(cell); return; }
    if (!swiped) { tapCell(cell); return; }
    beginStroke(cell, mine.sx, mine.sy);
    paintTo(sx, sy);
    stroke = null;
    updateMarkers();
  });
  addEventListener('pointercancel', (e) => {
    endTouch(e.pointerId);
    if (!touches.size) multiTouch = false;
    press = null;
    stroke = null;
    linkDrag = null;
    if (editMode) updateMarkers();
  });
  scene.onBeforeRenderObservable.add(() => { if (markersDirty) updateMarkers(); });
  addEventListener('keydown', (e) => {
    if (e.key === 'ArrowLeft') orbit(1);
    if (e.key === 'ArrowRight') orbit(-1);
    if (e.key === 'ArrowUp') walk(1);
    if (e.key === 'ArrowDown') walk(-1);
    if (e.key === 'PageUp') setView(1);
    if (e.key === 'PageDown') setView(-1);
    if (e.key === 'Backspace' && !editMode) { e.preventDefault(); goBack(); }
    if (e.key === 'e' || e.key === 'E') setEditMode(!editMode);
    if (e.key === 'd' || e.key === 'D') setDebugRays(!debugRays);
    if (editMode && (e.key === 'p' || e.key === 'P')) setPathMode(!pathMode);
    if (editMode && e.key === 'Escape' && selected >= 0) { selected = -1; updateMarkers(); }
    if (editMode && (e.key === 'z' || e.key === 'Z')) undo();
    if (editMode && (e.key === 'k' || e.key === 'K')) cycleKind();
    if (editMode && (e.key === 'b' || e.key === 'B')) setDrawing(!drawing);
    if (editMode && (e.key === 'v' || e.key === 'V')) pinView();
  });
  let wheelAt = 0;
  addEventListener('wheel', (e) => {
    if (performance.now() - wheelAt < 350) return;
    wheelAt = performance.now();
    setView(e.deltaY > 0 ? 1 : -1);
  }, { passive: true });
  document.getElementById('back').addEventListener('click', goBack);
  document.getElementById('rotL').addEventListener('click', () => orbit(1));
  document.getElementById('rotR').addEventListener('click', () => orbit(-1));
  document.getElementById('tiltU').addEventListener('click', () => setView(1));
  document.getElementById('tiltD').addEventListener('click', () => setView(-1));
  document.getElementById('edit').addEventListener('click', () => setEditMode(!editMode));
  document.getElementById('dbg').addEventListener('click', () => setDebugRays(!debugRays));
  document.getElementById('undo').addEventListener('click', undo);
  document.getElementById('kind').addEventListener('click', cycleKind);
  document.getElementById('draw').addEventListener('click', () => setDrawing(!drawing));
  document.getElementById('pin').addEventListener('click', pinView);
  document.getElementById('path').addEventListener('click', () => setPathMode(!pathMode));
  document.getElementById('save').addEventListener('click', exportReview);

  renderHud();
  rebuildMarkers();
  glideFacing(cur, 1);
  engine.runRenderLoop(() => scene.render());
  addEventListener('resize', () => engine.resize());
})().catch((e) => {
  hud.innerHTML = `<b>Failed to load</b><br><small>${e.message}<br>
Run <code>node tools/scene/merge-scene.mjs models/scenes/${SCENE}.glb</code> and\n<code>node tools/build/build-grid-cells.mjs models/scenes/${SCENE}.glb</code> first, and serve this page over HTTP.</small>
<small class="ver">viewer ${VIEWER_VERSION}</small>`;
  throw e;
});
</script>
</body>
</html>

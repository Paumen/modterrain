<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Modular Terrain — Walkthrough</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><text y='14' font-size='14'>⛰️</text></svg>">
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #1a2028; }
  canvas { width: 100%; height: 100%; display: block; touch-action: none; outline: none; }
  .hud {
    position: fixed; top: 12px; left: 12px; color: #dfe7ee; font: 13px/1.5 system-ui, sans-serif;
    background: rgba(20, 26, 34, 0.7); padding: 8px 12px; border-radius: 8px; pointer-events: none;
  }
  .hud b { font-size: 14px; }
  .hud small { opacity: 0.75; }
  .bar {
    position: fixed; bottom: 16px; left: 50%; transform: translateX(-50%);
    display: flex; gap: 10px; background: rgba(20, 26, 34, 0.75); padding: 8px; border-radius: 14px;
  }
  .bar button {
    width: 52px; height: 52px; border: 0; border-radius: 10px; background: #2c3644; color: #eef4fa;
    font-size: 22px; cursor: pointer; touch-action: manipulation;
  }
  .bar button:active { background: #3e4c5e; }
</style>
</head>
<body>
<canvas id="view"></canvas>
<div class="hud"><b>Walkthrough</b><br>
<small>Tap a dot or any spot to travel there<br>
Swipe &#8596; orbit · swipe &#8597; tilt · &#65291;/&#8722; zoom (3 levels)</small></div>
<div class="bar">
  <button id="rotL" title="Orbit left (&#8592;)">&#10226;</button>
  <button id="tiltU" title="View from higher up">&#9650;</button>
  <button id="tiltD" title="View from lower down">&#9660;</button>
  <button id="zin" title="Zoom in">&#65291;</button>
  <button id="zout" title="Zoom out">&#8722;</button>
  <button id="rotR" title="Orbit right (&#8594;)">&#10227;</button>
</div>
<script src="vendor/babylon/babylon.js"></script>
<script src="vendor/babylon/babylonjs.loaders.min.js"></script>
<script>
'use strict';
const SCENE = new URLSearchParams(location.search).get('scene') || 'Large_Island_v2_No_Ocean_No_Props';
const canvas = document.getElementById('view');

const TAU8 = Math.PI / 4;
const smooth = (t) => t * t * (3 - 2 * t);

async function makeEngine() {
  if (navigator.gpu && BABYLON.WebGPUEngine) {
    try {
      const engine = new BABYLON.WebGPUEngine(canvas, { antialias: true });
      await engine.initAsync();
      return engine;
    } catch (e) { console.warn('WebGPU unavailable, falling back to WebGL', e); }
  }
  return new BABYLON.Engine(canvas, true);
}

(async () => {
  const [engine, nav] = await Promise.all([
    makeEngine(),
    fetch(`scenes/${SCENE}_nav.json`).then((r) => r.json()),
  ]);
  const scene = new BABYLON.Scene(engine);
  scene.clearColor = BABYLON.Color4.FromHexString('#1a2028ff');

  await BABYLON.SceneLoader.AppendAsync('scenes/', `${SCENE}_merged.glb`, scene);
  for (const mesh of scene.meshes) mesh.freezeWorldMatrix();

  const sun = new BABYLON.DirectionalLight('sun', new BABYLON.Vector3(-0.5, -1, -0.35), scene);
  sun.intensity = 1.3;
  const sky = new BABYLON.HemisphericLight('sky', new BABYLON.Vector3(0, 1, 0), scene);
  sky.intensity = 1.2;
  sky.groundColor = new BABYLON.Color3(0.25, 0.22, 0.18);

  // --- camera: snapped 8-heading orbit at 3 fixed pitches ------------------
  const { eye, betas, cell, rays } = nav.meta;
  const TAU = Math.PI * 2;
  const centroid = nav.nodes.reduce((a, n) => [a[0] + n.p[0], a[1] + n.p[2]], [0, 0]).map((v) => v / nav.nodes.length);
  const start = nav.nodes.reduce((best, n, i) =>
    Math.hypot(n.p[0] - centroid[0], n.p[2] - centroid[1]) < Math.hypot(nav.nodes[best].p[0] - centroid[0], nav.nodes[best].p[2] - centroid[1]) ? i : best, 0);

  let cur = start;
  let stepCont = 0;               // unbounded heading counter, 8 snaps per turn
  let betaIdx = 1;                // 0 = high view, 1 = mid, 2 = low
  const ZOOMS = [0.45, 0.7, 1.0]; // near, mid, far
  let zoomIdx = 1;
  let zoom = ZOOMS[zoomIdx];
  const step = () => ((Math.round(stepCont) % 8) + 8) % 8;
  const floorR = cell * 0.8;
  const profile = (n, k) => nav.nodes[n].r[betaIdx][((k % rays) + rays) % rays];
  const safeRadius = (n) => Math.max(floorR, profile(n, step() * rays / 8) * zoom);
  const eyePoint = (n) => new BABYLON.Vector3(nav.nodes[n].p[0], nav.nodes[n].p[1] + eye, nav.nodes[n].p[2]);

  const camera = new BABYLON.ArcRotateCamera('cam', 0, betas[betaIdx], 1, eyePoint(start), scene);
  camera.minZ = cell * 0.1;
  camera.maxZ = cell * 400;
  camera.fov = 0.9;
  camera.inputs.clear();

  let tween = null;
  let route = [];
  let prevBeta = 1;
  function glideTo(node, ms) {
    const from = cur;
    cur = node;
    const fromBeta = prevBeta;
    prevBeta = betaIdx;
    tween = {
      from, leg: from !== node, fromBeta,
      t0: performance.now(), ms,
      target0: camera.target.clone(), target1: eyePoint(node),
      alpha0: camera.alpha, alpha1: stepCont * TAU8,
      beta0: camera.beta, beta1: betas[betaIdx],
      radius0: camera.radius, radius1: safeRadius(node),
    };
    updateMarkers();
  }
  scene.onBeforeRenderObservable.add(() => {
    if (!tween) return;
    const t = Math.min((performance.now() - tween.t0) / tween.ms, 1);
    const s = smooth(t);
    camera.target = BABYLON.Vector3.Lerp(tween.target0, tween.target1, s);
    camera.alpha = tween.alpha0 + (tween.alpha1 - tween.alpha0) * s;
    camera.beta = tween.beta0 + (tween.beta1 - tween.beta0) * s;
    camera.radius = tween.radius0 + (tween.radius1 - tween.radius0) * s;
    if (t === 1) {
      tween = null;
      if (route.length) { const nxt = route.shift(); glideTo(nxt, legMs(cur, nxt)); } else updateMarkers();
    }
  });

  // Terrain clamp, every frame: pull the camera in whenever its position
  // would dip below the top surface, so glides and orbit sweeps between the
  // precomputed snap positions cannot pass through walls either.
  const hm = nav.height;
  function groundTop(x, z) {
    const ix = Math.floor((x - hm.x0) / hm.step), iz = Math.floor((z - hm.z0) / hm.step);
    let top = -1e4;
    for (let a = 0; a <= 1; a++) for (let b = 0; b <= 1; b++) {
      const cx = ix + a, cz = iz + b;
      if (cx >= 0 && cx < hm.w && cz >= 0 && cz < hm.h) top = Math.max(top, hm.data[cz * hm.w + cx]);
    }
    return top;
  }
  function camPosAt(r) {
    return {
      x: camera.target.x + r * Math.cos(camera.alpha) * Math.sin(camera.beta),
      y: camera.target.y + r * Math.cos(camera.beta),
      z: camera.target.z + r * Math.sin(camera.alpha) * Math.sin(camera.beta),
    };
  }
  // The camera radius is capped every frame by the ray-verified radial
  // profile at the current heading, so an orbit sweep follows the measured
  // wall contour and cannot pass through terrain between snap positions.
  // While gliding between nodes the heightmap acts as an extra backstop.
  function profileGuard() {
    const f = (((camera.alpha % TAU) + TAU) % TAU) / (TAU / rays);
    const i0 = Math.floor(f), i1 = Math.ceil(f), frac = f - i0;
    const at = (n) => profile(n, i0) * (1 - frac) + profile(n, i1) * frac;
    let g = at(cur);
    if (tween && tween.leg) g = Math.min(g, at(tween.from));
    if (tween && tween.fromBeta !== betaIdx) {
      const keep = betaIdx;
      betaIdx = tween.fromBeta; g = Math.min(g, at(cur)); betaIdx = keep;
    }
    return Math.max(floorR, g * zoom);
  }
  // Eased radius with a hard safety cap: the eased value follows the desired
  // radius so collisions feel smooth, but it is clipped to the measured free
  // distance every frame, so it can never lag into a wall.
  let smoothR = null;
  scene.onBeforeRenderObservable.add(() => {
    if (!tween) camera.radius = safeRadius(cur);
    const guard = profileGuard();
    let target = Math.min(camera.radius, guard);
    if (tween && tween.leg) {
      const clear = cell * 0.4;
      for (let i = 0; i < 14 && target > floorR; i++) {
        const p = camPosAt(target);
        if (p.y >= groundTop(p.x, p.z) + clear) break;
        target = Math.max(floorR, target * 0.85);
      }
    }
    if (smoothR === null) smoothR = target;
    const dt = Math.min(scene.getEngine().getDeltaTime(), 50) / 1000;
    smoothR += (target - smoothR) * Math.min(1, dt * 12);
    smoothR = Math.min(smoothR, guard);
    camera.radius = smoothR;
  });

  // --- travel: cheapest path, strongly preferring walkways and trails ------
  const dist3 = (a, b) => Math.hypot(b.p[0] - a.p[0], b.p[1] - a.p[1], b.p[2] - a.p[2]);
  const surf = { p: 1, d: 3, g: 3.5 };
  const edgeCost = (a, b) => dist3(nav.nodes[a], nav.nodes[b]) * ((surf[nav.nodes[a].s] + surf[nav.nodes[b].s]) / 2);
  const legMs = (a, b) => Math.min(650, Math.max(280, dist3(nav.nodes[a], nav.nodes[b]) * 55));
  function travelTo(dest) {
    if (dest === cur) return;
    const dist = new Array(nav.nodes.length).fill(Infinity);
    const prev = new Array(nav.nodes.length).fill(-1);
    const done = new Array(nav.nodes.length).fill(false);
    dist[cur] = 0;
    for (;;) {
      let n = -1;
      for (let i = 0; i < dist.length; i++) if (!done[i] && (n === -1 || dist[i] < dist[n])) n = i;
      if (n === -1 || dist[n] === Infinity || n === dest) break;
      done[n] = true;
      for (const nb of nav.nodes[n].n) {
        const d = dist[n] + edgeCost(n, nb);
        if (d < dist[nb]) { dist[nb] = d; prev[nb] = n; }
      }
    }
    if (dist[dest] === Infinity) return;
    route = [];
    for (let n = dest; n !== -1; n = prev[n]) route.unshift(n);
    route.shift();
    if (route.length) { const nxt = route.shift(); glideTo(nxt, legMs(cur, nxt)); }
  }
  function nearestNode(point) {
    let best = 0, bestD = Infinity;
    nav.nodes.forEach((n, i) => {
      const d = Math.hypot(n.p[0] - point.x, (n.p[1] - point.y) * 2, n.p[2] - point.z);
      if (d < bestD) { bestD = d; best = i; }
    });
    return best;
  }
  const open = (n, k) => profile(n, (((k % 8) + 8) % 8) * rays / 8) > cell * 1.8;
  const orbit = (dir) => {
    route = [];
    let steps = 0;
    do { stepCont += dir; steps++; } while (steps < 8 && !open(cur, Math.round(stepCont)));
    glideTo(cur, Math.min(300 + 150 * steps, 800));
  };
  const tilt = (dir) => {
    const next = Math.min(betas.length - 1, Math.max(0, betaIdx + dir));
    if (next === betaIdx) return;
    betaIdx = next; route = [];
    // If this pitch has no room at the current heading, swing to the nearest open one.
    if (!open(cur, Math.round(stepCont))) {
      for (let d = 1; d < 8; d++) {
        if (open(cur, Math.round(stepCont) + d)) { stepCont += d; break; }
        if (open(cur, Math.round(stepCont) - d)) { stepCont -= d; break; }
      }
    }
    glideTo(cur, 400);
  };
  function walk(sign) {
    route = [];
    const fwd = camera.target.subtract(camera.position); fwd.y = 0; fwd.normalize();
    let best = -1, bestDot = 0.35;
    for (const nb of nav.nodes[cur].n) {
      const to = eyePoint(nb).subtract(camera.target); to.y = 0;
      const d = sign * BABYLON.Vector3.Dot(to.normalize(), fwd);
      if (d > bestDot) { bestDot = d; best = nb; }
    }
    if (best >= 0) glideTo(best, 500);
  }

  // --- markers: every node always shown, neighbours highlighted ------------
  const nearMat = new BABYLON.StandardMaterial('near', scene);
  nearMat.emissiveColor = BABYLON.Color3.FromHexString('#ffd75e');
  nearMat.disableLighting = true;
  const farMat = new BABYLON.StandardMaterial('far', scene);
  farMat.emissiveColor = BABYLON.Color3.FromHexString('#8aa3b8');
  farMat.disableLighting = true;
  farMat.alpha = 0.6;
  const routeMat = new BABYLON.StandardMaterial('route', scene);
  routeMat.emissiveColor = BABYLON.Color3.FromHexString('#ff9d47');
  routeMat.disableLighting = true;
  const hereMat = new BABYLON.StandardMaterial('here', scene);
  hereMat.emissiveColor = BABYLON.Color3.FromHexString('#7ee081');
  hereMat.disableLighting = true;

  const markers = nav.nodes.map((node, i) => {
    const orb = BABYLON.MeshBuilder.CreateSphere(`nav${i}`, { diameter: cell * 0.45, segments: 10 }, scene);
    orb.position = new BABYLON.Vector3(node.p[0], node.p[1] + cell * 0.35, node.p[2]);
    orb.metadata = { node: i };
    return orb;
  });
  function updateMarkers() {
    const near = new Set(nav.nodes[cur].n);
    const onRoute = new Set(route);
    markers.forEach((m, i) => {
      m.material = i === cur ? hereMat : onRoute.has(i) ? routeMat : near.has(i) ? nearMat : farMat;
      m.scaling.setAll(near.has(i) || onRoute.has(i) ? 1.25 : 1);
    });
  }
  updateMarkers();

  // --- input ---------------------------------------------------------------
  let down = null;
  scene.onPointerObservable.add((info) => {
    const e = info.event;
    if (info.type === BABYLON.PointerEventTypes.POINTERDOWN) down = { x: e.clientX, y: e.clientY };
    if (info.type !== BABYLON.PointerEventTypes.POINTERUP || !down) return;
    const dx = e.clientX - down.x, dy = e.clientY - down.y;
    down = null;
    if (Math.hypot(dx, dy) < 30) {
      // Prefer a marker under the tap; otherwise any terrain point.
      const marker = scene.pick(scene.pointerX, scene.pointerY, (m) => m.metadata?.node !== undefined);
      if (marker?.hit) return travelTo(marker.pickedMesh.metadata.node);
      const ground = scene.pick(scene.pointerX, scene.pointerY);
      if (ground?.hit) travelTo(nearestNode(ground.pickedPoint));
    } else if (Math.abs(dx) > Math.abs(dy)) {
      orbit(dx > 0 ? -1 : 1);
    } else {
      tilt(dy > 0 ? -1 : 1); // swipe down = view from higher up
    }
  });
  addEventListener('keydown', (e) => {
    if (e.key === 'ArrowLeft') orbit(1);
    if (e.key === 'ArrowRight') orbit(-1);
    if (e.key === 'ArrowUp') walk(1);
    if (e.key === 'ArrowDown') walk(-1);
    if (e.key === 'PageUp') tilt(-1);
    if (e.key === 'PageDown') tilt(1);
  });
  const setZoom = (d) => {
    zoomIdx = Math.min(ZOOMS.length - 1, Math.max(0, zoomIdx + d));
    zoom = ZOOMS[zoomIdx];
    if (!tween) glideTo(cur, 300);
  };
  let wheelAt = 0;
  addEventListener('wheel', (e) => {
    if (performance.now() - wheelAt < 350) return;
    wheelAt = performance.now();
    setZoom(e.deltaY > 0 ? 1 : -1);
  }, { passive: true });
  document.getElementById('zin').addEventListener('click', () => setZoom(-1));
  document.getElementById('zout').addEventListener('click', () => setZoom(1));
  document.getElementById('rotL').addEventListener('click', () => orbit(1));
  document.getElementById('rotR').addEventListener('click', () => orbit(-1));
  document.getElementById('tiltU').addEventListener('click', () => tilt(-1));
  document.getElementById('tiltD').addEventListener('click', () => tilt(1));

  glideTo(start, 1);
  engine.runRenderLoop(() => scene.render());
  addEventListener('resize', () => engine.resize());
})().catch((e) => {
  document.querySelector('.hud').innerHTML = `<b>Failed to load</b><br><small>${e.message}<br>
Run <code>node tools/merge-scene.mjs scenes/${SCENE}.glb</code> first, and serve this page over HTTP.</small>`;
  throw e;
});
</script>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Modular Terrain — Walkthrough</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><text y='14' font-size='14'>⛰️</text></svg>">
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #1a2028; }
  canvas { width: 100%; height: 100%; display: block; touch-action: none; outline: none; }
  .hud {
    position: fixed; top: 12px; left: 12px; color: #dfe7ee; font: 13px/1.5 system-ui, sans-serif;
    background: rgba(20, 26, 34, 0.7); padding: 8px 12px; border-radius: 8px; pointer-events: none;
    max-width: 300px;
  }
  .hud b { font-size: 14px; }
  .hud small { opacity: 0.75; }
  .bar {
    position: fixed; bottom: 16px; left: 50%; transform: translateX(-50%);
    display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; max-width: calc(100vw - 24px);
    background: rgba(20, 26, 34, 0.75); padding: 8px; border-radius: 14px;
  }
  .bar button {
    width: 48px; height: 48px; border: 0; border-radius: 10px; background: #2c3644; color: #eef4fa;
    font-size: 20px; cursor: pointer; touch-action: manipulation;
  }
  .bar button:active { background: #3e4c5e; }
  .bar button.on { background: #7a5c1e; }
</style>
</head>
<body>
<canvas id="view"></canvas>
<div class="hud" id="hud"></div>
<div class="bar">
  <button id="back" title="Back to where you came from (Backspace)" disabled>&#8617;</button>
  <button id="rotL" title="Orbit left (&#8592;)">&#10226;</button>
  <button id="tiltU" title="Wider, higher view">&#9650;</button>
  <button id="tiltD" title="Closer, lower view">&#9660;</button>
  <button id="rotR" title="Orbit right (&#8594;)">&#10227;</button>
  <button id="edit" title="Edit nodes (E)">&#9998;</button>
  <button id="erase" title="Eraser: tap nodes to delete" hidden>&#9003;</button>
  <button id="del" title="Delete selected node" hidden>&#128465;</button>
  <button id="undo" title="Undo last edit" hidden>&#8634;</button>
  <button id="save" title="Download edited nav JSON" hidden>&#128190;</button>
</div>
<script src="vendor/babylon/babylon.js"></script>
<script src="vendor/babylon/babylonjs.loaders.min.js"></script>
<script>
'use strict';
const SCENE = new URLSearchParams(location.search).get('scene') || 'Large_Island_v2_No_Ocean_No_Props';
const canvas = document.getElementById('view');
const hud = document.getElementById('hud');

const TAU = Math.PI * 2;
const STEPS = 6;                 // orbit snaps: 6 isometric headings, 60 apart
const STEP_ANGLE = TAU / STEPS;
// Angle and distance move together: one ladder from close-and-low (eye level,
// in among the pieces) to far-and-high (overview of the island).
// Editing wants to look down on the graph; walking around it does not.
const MAP_VIEW = { beta: 0.42, zoom: 1.35 };
// Five rungs from closest-and-lowest to widest-and-highest. Distance steps
// are geometric (each rung is 1.81x the last), which is what reads as an
// even step when zooming; the pitch steps are an even 0.12 rad apart.
const VIEWS = [
  { beta: 1.50, zoom: 0.28 },
  { beta: 1.38, zoom: 0.51 },
  { beta: 1.26, zoom: 0.92 },
  { beta: 1.14, zoom: 1.66 },
  { beta: 1.02, zoom: 3.00 },
];
const smooth = (t) => t * t * (3 - 2 * t);

const VIEW_HELP = `<b>Walkthrough</b><br>
<small>Tap a dot or any spot to travel there<br>
Swipe &#8596; orbit &middot; swipe &#8597; or &#9650;/&#9660; closer/wider &middot; &#8617; back &middot; &#9998; edit nodes</small>`;
const EDIT_HELP = `<b>Node editor</b><br>
<small>&#9003; eraser: tap a node to delete it, or tap a line to cut it<br>
Otherwise tap ground to add &middot; tap two nodes to link &middot; &#8634; undo<br>
&#128190; downloads JSON &mdash; save over scenes/${SCENE}_nav.json to keep</small>`;

async function makeEngine() {
  if (navigator.gpu && BABYLON.WebGPUEngine) {
    try {
      const engine = new BABYLON.WebGPUEngine(canvas, { antialias: true });
      await engine.initAsync();
      return engine;
    } catch (e) { console.warn('WebGPU unavailable, falling back to WebGL', e); }
  }
  return new BABYLON.Engine(canvas, true);
}

(async () => {
  const [engine, nav] = await Promise.all([
    makeEngine(),
    fetch(`scenes/${SCENE}_nav.json`).then((r) => r.json()),
  ]);
  const { eye, cell } = nav.meta;
  const scene = new BABYLON.Scene(engine);
  // glTF is right-handed. Without this Babylon's loader wraps the model in a
  // __root__ that flips handedness by negating X, so the terrain renders
  // mirrored against the nav graph's coordinates: nodes land in mid-air or
  // inside rock, and the camera orbits a mirror image of the island.
  scene.useRightHandedSystem = true;
  scene.clearColor = BABYLON.Color4.FromHexString('#1a2028ff');

  await BABYLON.SceneLoader.AppendAsync('scenes/', `${SCENE}_merged.glb`, scene);
  const terrain = scene.meshes.filter((m) => m.getTotalVertices() > 0);
  for (const mesh of scene.meshes) mesh.freezeWorldMatrix();

  const sun = new BABYLON.DirectionalLight('sun', new BABYLON.Vector3(-0.5, -1, -0.35), scene);
  sun.intensity = 1.3;
  const sky = new BABYLON.HemisphericLight('sky', new BABYLON.Vector3(0, 1, 0), scene);
  sky.intensity = 1.2;
  sky.groundColor = new BABYLON.Color3(0.25, 0.22, 0.18);

  // --- collision: one ray per frame against the real triangles -------------
  // All terrain triangles in camera space, binned by XZ cell; a ray walks the
  // bins (2D DDA). This is the only collision mechanism: whatever state the
  // camera is in - orbiting, tilting, zooming, gliding - the ray from the
  // look-target to the wanted position is measured against the actual
  // geometry every frame.
  let tris, triBox, bins, BW, BH, bMinX, bMinZ;
  const BIN = cell;
  {
    const arrs = [];
    let total = 0;
    for (const mesh of terrain) {
      mesh.computeWorldMatrix(true);
      const wm = mesh.getWorldMatrix();
      const src = mesh.getVerticesData(BABYLON.VertexBuffer.PositionKind);
      const out = new Float32Array(src.length);
      const v = new BABYLON.Vector3();
      for (let i = 0; i < src.length; i += 3) {
        BABYLON.Vector3.TransformCoordinatesFromFloatsToRef(src[i], src[i + 1], src[i + 2], wm, v);
        out[i] = v.x; out[i + 1] = v.y; out[i + 2] = v.z;
      }
      arrs.push(out);
      total += out.length;
    }
    tris = new Float32Array(total);
    let o = 0;
    for (const a of arrs) { tris.set(a, o); o += a.length; }
    const nTris = tris.length / 9;
    triBox = new Float32Array(nTris * 6);
    bMinX = Infinity; bMinZ = Infinity;
    let maxX = -Infinity, maxZ = -Infinity;
    for (let t = 0; t < nTris; t++) {
      const b = t * 9;
      const x0 = Math.min(tris[b], tris[b + 3], tris[b + 6]), x1 = Math.max(tris[b], tris[b + 3], tris[b + 6]);
      const y0 = Math.min(tris[b + 1], tris[b + 4], tris[b + 7]), y1 = Math.max(tris[b + 1], tris[b + 4], tris[b + 7]);
      const z0 = Math.min(tris[b + 2], tris[b + 5], tris[b + 8]), z1 = Math.max(tris[b + 2], tris[b + 5], tris[b + 8]);
      triBox.set([x0, y0, z0, x1, y1, z1], t * 6);
      bMinX = Math.min(bMinX, x0); bMinZ = Math.min(bMinZ, z0);
      maxX = Math.max(maxX, x1); maxZ = Math.max(maxZ, z1);
    }
    BW = Math.ceil((maxX - bMinX) / BIN) + 1;
    BH = Math.ceil((maxZ - bMinZ) / BIN) + 1;
    bins = Array.from({ length: BW * BH }, () => []);
    const bx = (x) => Math.max(0, Math.min(BW - 1, Math.floor((x - bMinX) / BIN)));
    const bz = (z) => Math.max(0, Math.min(BH - 1, Math.floor((z - bMinZ) / BIN)));
    for (let t = 0; t < nTris; t++) {
      const b = t * 6;
      for (let iz = bz(triBox[b + 2]); iz <= bz(triBox[b + 5]); iz++)
        for (let ix = bx(triBox[b]); ix <= bx(triBox[b + 3]); ix++) bins[iz * BW + ix].push(t);
    }
  }
  const seen = new Int32Array(tris.length / 9);
  let seenStamp = 0;
  function raycast(ox, oy, oz, dx, dy, dz, tMax) {
    let best = Infinity;
    const stamp = ++seenStamp;
    const testBin = (ix, iz) => {
      if (ix < 0 || ix >= BW || iz < 0 || iz >= BH) return;
      for (const t of bins[iz * BW + ix]) {
        if (seen[t] === stamp) continue;
        seen[t] = stamp;
        const b = t * 9;
        const e1x = tris[b + 3] - tris[b], e1y = tris[b + 4] - tris[b + 1], e1z = tris[b + 5] - tris[b + 2];
        const e2x = tris[b + 6] - tris[b], e2y = tris[b + 7] - tris[b + 1], e2z = tris[b + 8] - tris[b + 2];
        const px = dy * e2z - dz * e2y, py = dz * e2x - dx * e2z, pz = dx * e2y - dy * e2x;
        const det = e1x * px + e1y * py + e1z * pz;
        if (Math.abs(det) < 1e-12) continue;
        const inv = 1 / det;
        const tx = ox - tris[b], ty = oy - tris[b + 1], tz = oz - tris[b + 2];
        const u = (tx * px + ty * py + tz * pz) * inv;
        if (u < 0 || u > 1) continue;
        const qx = ty * e1z - tz * e1y, qy = tz * e1x - tx * e1z, qz = tx * e1y - ty * e1x;
        const v = (dx * qx + dy * qy + dz * qz) * inv;
        if (v < 0 || u + v > 1) continue;
        const hit = (e2x * qx + e2y * qy + e2z * qz) * inv;
        if (hit > 0.001 && hit < tMax && hit < best) best = hit;
      }
    };
    let ix = Math.floor((ox - bMinX) / BIN), iz = Math.floor((oz - bMinZ) / BIN);
    const stepX = dx > 0 ? 1 : -1, stepZ = dz > 0 ? 1 : -1;
    let tX = dx !== 0 ? ((bMinX + (ix + (dx > 0 ? 1 : 0)) * BIN) - ox) / dx : Infinity;
    let tZ = dz !== 0 ? ((bMinZ + (iz + (dz > 0 ? 1 : 0)) * BIN) - oz) / dz : Infinity;
    const dX = dx !== 0 ? Math.abs(BIN / dx) : Infinity, dZ = dz !== 0 ? Math.abs(BIN / dz) : Infinity;
    let t = 0;
    for (let i = 0; i < BW + BH && t <= tMax && t < best; i++) {
      for (let a = -1; a <= 1; a++) for (let b = -1; b <= 1; b++) testBin(ix + a, iz + b);
      if (tX < tZ) { t = tX; tX += dX; ix += stepX; } else { t = tZ; tZ += dZ; iz += stepZ; }
    }
    return best;
  }

  // --- camera --------------------------------------------------------------
  const centroid = nav.nodes.reduce((a, n) => [a[0] + n.p[0], a[1] + n.p[2]], [0, 0]).map((v) => v / nav.nodes.length);
  const start = nav.nodes.reduce((best, n, i) =>
    Math.hypot(n.p[0] - centroid[0], n.p[2] - centroid[1]) < Math.hypot(nav.nodes[best].p[0] - centroid[0], nav.nodes[best].p[2] - centroid[1]) ? i : best, 0);

  const asked = parseInt(new URLSearchParams(location.search).get('node') ?? '', 10);
  let cur = Number.isInteger(asked) && asked >= 0 && asked < nav.nodes.length ? asked : start;
  let stepCont = 0;
  let viewIdx = 1;
  let mapView = false;
  const view = () => (mapView ? MAP_VIEW : VIEWS[viewIdx]);
  const floorR = cell * 0.8, maxR = cell * 22, margin = cell * 0.5;
  const step = () => ((Math.round(stepCont) % STEPS) + STEPS) % STEPS;
  // Nodes under a low roof carry their own eye height, so the camera target
  // ducks into the cave instead of sitting in the ceiling.
  const eyeOf = (n) => nav.nodes[n].e ?? eye;
  const eyePoint = (n) => new BABYLON.Vector3(nav.nodes[n].p[0], nav.nodes[n].p[1] + eyeOf(n), nav.nodes[n].p[2]);
  const dirAt = (alpha, beta) => [Math.cos(alpha) * Math.sin(beta), Math.cos(beta), Math.sin(alpha) * Math.sin(beta)];

  // Free camera distance from a node at a snapped heading, measured live.
  // A camera is a volume, not a point: the near plane has corners, and
  // terrain beside the camera slices through it even when nothing lies on the
  // centre line - which reads as seeing straight through a wall, since the
  // pieces are single-sided shells. So every cast is a cylinder: the centre
  // ray plus four rays offset by the near plane's corner radius.
  function nearRadius() {
    const h = camera.minZ * Math.tan(camera.fov / 2);
    return Math.hypot(h, h * engine.getAspectRatio(camera)) + cell * 0.04;
  }
  const perp = (dx, dy, dz) => {
    const ax = Math.abs(dy) < 0.9 ? [0, 1, 0] : [1, 0, 0];
    let ux = ax[1] * dz - ax[2] * dy, uy = ax[2] * dx - ax[0] * dz, uz = ax[0] * dy - ax[1] * dx;
    const ul = Math.hypot(ux, uy, uz) || 1;
    ux /= ul; uy /= ul; uz /= ul;
    return [[ux, uy, uz], [dy * uz - dz * uy, dz * ux - dx * uz, dx * uy - dy * ux]];
  };
  function thickCast(ox, oy, oz, dx, dy, dz, tMax, probe) {
    let best = raycast(ox, oy, oz, dx, dy, dz, tMax);
    const [u, v] = perp(dx, dy, dz);
    for (const [sx, sy, sz] of [u, v, [-u[0], -u[1], -u[2]], [-v[0], -v[1], -v[2]]]) {
      const hit = raycast(ox + sx * probe, oy + sy * probe, oz + sz * probe, dx, dy, dz, tMax);
      if (hit < best) best = hit;
    }
    return best;
  }

  function freeAt(n, k, vi = mapView ? -1 : viewIdx) {
    const p = eyePoint(n);
    const [dx, dy, dz] = dirAt(k * STEP_ANGLE, vi === -1 ? MAP_VIEW.beta : VIEWS[vi].beta);
    const probe = nearRadius();
    const hit = thickCast(p.x, p.y, p.z, dx, dy, dz, maxR + margin, probe);
    return Math.min(maxR, hit - margin);
  }
  const wantRadius = (n) => Math.max(floorR, freeAt(n, step()) * view().zoom);
  // Enough room to be worth turning to. Kept low deliberately: in a cave no
  // heading has much space, and a demanding threshold makes orbit skip every
  // one of them and land back where it started.
  const MIN_ROOM = cell * 0.9;
  const open = (n, k) => freeAt(n, ((k % STEPS) + STEPS) % STEPS) > MIN_ROOM;

  const camera = new BABYLON.ArcRotateCamera('cam', 0, view().beta, 1, eyePoint(start), scene);
  camera.minZ = cell * 0.03;
  camera.maxZ = cell * 400;
  camera.fov = 0.9;
  camera.inputs.clear();

  let tween = null;
  let route = [];
  // A node whose only neighbour is out of sight would otherwise be a trap,
  // so every arrival is remembered and Back always leads out.
  const history = [];
  let recording = true;
  function pushHistory(from) {
    if (history[history.length - 1] === from) return;
    history.push(from);
    if (history.length > 60) history.shift();
    const b = document.getElementById('back');
    if (b) b.disabled = false;
  }
  function goBack() {
    if (!history.length) return;
    route = [];
    const to = history.pop();
    const b = document.getElementById('back');
    if (b) b.disabled = !history.length;
    recording = false;
    stepCont = bestHeading(to);
    glideTo(to, 420);
    recording = true;
  }
  function glideTo(node, ms) {
    if (recording && cur !== node) pushHistory(cur);
    cur = node;
    tween = {
      t0: performance.now(), ms,
      target0: camera.target.clone(), target1: eyePoint(node),
      alpha0: camera.alpha, alpha1: stepCont * STEP_ANGLE,
      beta0: camera.beta, beta1: view().beta,
      radius0: camera.radius, radius1: wantRadius(node),
    };
    updateMarkers();
  }
  scene.onBeforeRenderObservable.add(() => {
    if (tween) {
      const t = Math.min((performance.now() - tween.t0) / tween.ms, 1);
      const s = smooth(t);
      camera.target = BABYLON.Vector3.Lerp(tween.target0, tween.target1, s);
      camera.alpha = tween.alpha0 + (tween.alpha1 - tween.alpha0) * s;
      camera.beta = tween.beta0 + (tween.beta1 - tween.beta0) * s;
      camera.radius = tween.radius0 + (tween.radius1 - tween.radius0) * s;
      if (t === 1) {
        tween = null;
        if (route.length) { const nxt = route.shift(); glideFacing(nxt, legMs(cur, nxt)); } else updateMarkers();
      }
    }
  });

  // The collision pass runs after the tween so it sees the frame's wanted
  // state. Eased so walls read as a smooth pull-in, but hard-capped by the
  // measured free distance, so the camera can never end a frame inside a wall.
  let smoothR = null;
  scene.onBeforeRenderObservable.add(() => {
    const wanted = camera.radius;
    const tgt = camera.target;
    const [dx, dy, dz] = dirAt(camera.alpha, camera.beta);
    const probe = nearRadius();
    const hit = thickCast(tgt.x, tgt.y, tgt.z, dx, dy, dz, wanted + margin, probe);
    // Clearance covers the near plane itself, so the frustum never crosses a
    // surface; it is small (the near plane is tiny), which lets the camera
    // tuck into narrow spots without the view punching through.
    const clearance = Math.hypot(camera.minZ, probe) * 1.3;
    const cap = Math.min(wanted, hit - clearance);
    if (smoothR === null) smoothR = cap;
    const dt = Math.min(engine.getDeltaTime(), 50) / 1000;
    smoothR += (cap - smoothR) * Math.min(1, dt * 10);
    camera.radius = Math.max(camera.minZ, Math.min(smoothR, cap));
    smoothR = camera.radius;
    // Squeezed into a cave the camera has nowhere to pull back to, so widen
    // the lens instead: a tight space shows far more through a wide angle.
    const tight = Math.min(1, Math.max(0, 1 - camera.radius / (cell * 4)));
    const wantFov = 0.9 + 0.5 * tight;
    camera.fov += (wantFov - camera.fov) * Math.min(1, dt * 8);
  });

  // --- travel: cheapest path, strongly preferring walkways and trails ------
  const dist3 = (a, b) => Math.hypot(b.p[0] - a.p[0], b.p[1] - a.p[1], b.p[2] - a.p[2]);
  const surf = { p: 1, d: 3, g: 3.5 };
  const edgeCost = (a, b) => dist3(nav.nodes[a], nav.nodes[b]) * (((surf[nav.nodes[a].s] || 2) + (surf[nav.nodes[b].s] || 2)) / 2);
  const legMs = (a, b) => Math.min(650, Math.max(280, dist3(nav.nodes[a], nav.nodes[b]) * 55));
  function travelTo(dest) {
    if (dest === cur) return;
    const dist = new Array(nav.nodes.length).fill(Infinity);
    const prev = new Array(nav.nodes.length).fill(-1);
    const done = new Array(nav.nodes.length).fill(false);
    dist[cur] = 0;
    for (;;) {
      let n = -1;
      for (let i = 0; i < dist.length; i++) if (!done[i] && (n === -1 || dist[i] < dist[n])) n = i;
      if (n === -1 || dist[n] === Infinity || n === dest) break;
      done[n] = true;
      for (const nb of nav.nodes[n].n) {
        const d = dist[n] + edgeCost(n, nb);
        if (d < dist[nb]) { dist[nb] = d; prev[nb] = n; }
      }
    }
    // A hand-curated graph can have separate pieces (a plateau reached only
    // by stairs that were cut, or a second island). Travel there directly
    // rather than letting the tap do nothing.
    if (dist[dest] === Infinity) { route = []; return glideFacing(dest, 700); }
    route = [];
    for (let n = dest; n !== -1; n = prev[n]) route.unshift(n);
    route.shift();
    if (route.length) { const nxt = route.shift(); glideFacing(nxt, legMs(cur, nxt)); }
  }
  // Tap targets are a fixed radius in screen pixels, so a node is easy to hit
  // however small it draws at distance. Ties go to whichever is nearer the
  // camera, so a foreground node wins over one behind it.
  const TAP_PX = 44;
  const ON_DOT_PX = 18;   // inside this the finger is on the dot, not a line
  let lastTapDist = Infinity;
  function markerAtScreen(px, py) {
    const eng = engine;
    const vp = camera.viewport.toGlobal(eng.getRenderWidth(), eng.getRenderHeight());
    const xform = scene.getTransformMatrix();
    const ident = BABYLON.Matrix.Identity();
    const scale = eng.getRenderWidth() / (canvas.clientWidth || eng.getRenderWidth());
    const limit = TAP_PX * scale;
    let best = -1, bestScore = Infinity, bestRaw = Infinity;
    for (const i of shown) {
      const q = nav.nodes[i].p;
      const p = BABYLON.Vector3.Project(new BABYLON.Vector3(q[0], q[1] + cell * 0.05, q[2]), ident, xform, vp);
      if (p.z <= 0 || p.z >= 1) continue;
      const d = Math.hypot(p.x - px * scale, p.y - py * scale);
      if (d > limit) continue;
      const score = d + p.z * limit; // nearer to camera breaks ties
      if (score < bestScore) { bestScore = score; best = i; bestRaw = d / scale; }
    }
    lastTapDist = best >= 0 ? bestRaw : Infinity;
    return best;
  }

  // Connections are tapped directly: the eraser removes whichever edge the
  // finger lands on, so unlinking is one tap instead of selecting both ends.
  const EDGE_PX = 26;
  let lastEdgeDist = Infinity;
  function edgeAtScreen(px, py) {
    const eng = engine;
    const vp = camera.viewport.toGlobal(eng.getRenderWidth(), eng.getRenderHeight());
    const xform = scene.getTransformMatrix();
    const ident = BABYLON.Matrix.Identity();
    const scale = eng.getRenderWidth() / (canvas.clientWidth || eng.getRenderWidth());
    const tx = px * scale, ty = py * scale;
    const proj = nav.nodes.map((n) =>
      BABYLON.Vector3.Project(new BABYLON.Vector3(n.p[0], n.p[1] + cell * 0.05, n.p[2]), ident, xform, vp));
    let best = null, bestD = EDGE_PX * scale;
    for (let i = 0; i < nav.nodes.length; i++) {
      const a = proj[i];
      if (a.z <= 0 || a.z >= 1 || !nearCur(i)) continue;
      for (const j of nav.nodes[i].n) {
        if (j <= i || !nearCur(j)) continue;
        const b = proj[j];
        if (b.z <= 0 || b.z >= 1) continue;
        const vx = b.x - a.x, vy = b.y - a.y;
        const len2 = vx * vx + vy * vy;
        const t = len2 ? Math.max(0, Math.min(1, ((tx - a.x) * vx + (ty - a.y) * vy) / len2)) : 0;
        const d = Math.hypot(a.x + vx * t - tx, a.y + vy * t - ty);
        if (d < bestD) { bestD = d; best = [i, j]; }
      }
    }
    lastEdgeDist = best ? bestD / scale : Infinity;
    return best;
  }
  function removeEdge(i, j) {
    pushUndo();
    const a = nav.nodes[i].n, b = nav.nodes[j].n;
    const ka = a.indexOf(j); if (ka >= 0) a.splice(ka, 1);
    const kb = b.indexOf(i); if (kb >= 0) b.splice(kb, 1);
    route = [];
    updateMarkers();
  }

  function nearestNode(point) {
    let best = 0, bestD = Infinity;
    nav.nodes.forEach((n, i) => {
      const d = Math.hypot(n.p[0] - point.x, (n.p[1] - point.y) * 2, n.p[2] - point.z);
      if (d < bestD) { bestD = d; best = i; }
    });
    return best;
  }
  // On arrival, face the way that actually has room: keep the current heading
  // when it is open, otherwise turn to the nearest one that is. Without this a
  // node in a tight spot leaves the camera pressed against rock.
  function bestHeading(node) {
    const base = Math.round(stepCont);
    let bestK = base, bestScore = -Infinity;
    for (let d = 0; d <= STEPS / 2; d++) {
      for (const k of d === 0 ? [base] : [base + d, base - d]) {
        const free = Math.min(freeAt(node, ((k % STEPS) + STEPS) % STEPS), cell * 8);
        const score = free - d * cell * 0.35;
        if (score > bestScore) { bestScore = score; bestK = k; }
      }
    }
    return bestK;
  }
  function glideFacing(node, ms) {
    stepCont = bestHeading(node);
    glideTo(node, ms);
  }

  const orbit = (dir) => {
    route = [];
    const from = Math.round(stepCont);
    // One step per press, skipping only headings jammed hard against a
    // surface, and never so many that it wraps back to where it started.
    let k = from + dir, steps = 1;
    while (steps < STEPS - 1 && !open(cur, k)) { k += dir; steps++; }
    if (!open(cur, k)) { k = from + dir; steps = 1; }
    stepCont = k;
    glideTo(cur, Math.min(300 + 120 * steps, 700));
  };
  // One ladder for both: higher up also pulls further back.
  const setView = (dir) => {
    const next = Math.min(VIEWS.length - 1, Math.max(0, viewIdx + dir));
    if (next === viewIdx && !mapView) return;
    viewIdx = next; mapView = false; route = [];
    if (!open(cur, Math.round(stepCont))) {
      for (let d = 1; d < STEPS; d++) {
        if (open(cur, Math.round(stepCont) + d)) { stepCont += d; break; }
        if (open(cur, Math.round(stepCont) - d)) { stepCont -= d; break; }
      }
    }
    glideTo(cur, 400);
  };
  function walk(sign) {
    route = [];
    const fwd = camera.target.subtract(camera.position); fwd.y = 0; fwd.normalize();
    let best = -1, bestDot = 0.35;
    for (const nb of nav.nodes[cur].n) {
      const to = eyePoint(nb).subtract(camera.target); to.y = 0;
      const d = sign * BABYLON.Vector3.Dot(to.normalize(), fwd);
      if (d > bestDot) { bestDot = d; best = nb; }
    }
    if (best >= 0) {
      // Walking must never turn the camera around: the roomiest heading at
      // the destination is usually the open ground you just came from, and
      // facing it flips "forward" so the next step walks straight back.
      // Keep the heading, or at most turn one notch to find room.
      const k = Math.round(stepCont);
      stepCont = open(best, k) ? k : open(best, k + 1) ? k + 1 : open(best, k - 1) ? k - 1 : k;
      glideTo(best, 500);
    }
  }

  // --- markers -------------------------------------------------------------
  const mat = (hex, alpha) => {
    const m = new BABYLON.StandardMaterial('m' + hex, scene);
    m.emissiveColor = BABYLON.Color3.FromHexString(hex);
    m.disableLighting = true;
    if (alpha) m.alpha = alpha;
    return m;
  };
  const nearMat = mat('#ffd75e'), farMat = mat('#b9c8d6', 0.5), hereMat = mat('#7ee081');
  const routeMat = mat('#ff9d47'), selMat = mat('#5ed7ff');
  // Neighbours draw on top of terrain: inside a cave the way out is behind a
  // wall, and a marker you cannot see is a marker you cannot tap.
  for (const m of [nearMat, hereMat, routeMat, selMat]) m.disableDepthWrite = true;
  let markers = [];
  // Flat pads lying on the surface: with no vertical extent they cannot poke
  // above a ridgeline and read as dots floating in the sky. Their drawn size
  // is independent of the tap target, which is measured in screen pixels.
  // Only the nodes on show get a mesh, recycled as you move. One mesh per
  // node meant well over a thousand of them on a dense graph, which is most
  // of the page's start-up cost and a sixfold rise in per-frame work.
  let shown = new Set();
  function meshAt(slot) {
    while (markers.length <= slot) {
      const i = markers.length;
      const orb = BABYLON.MeshBuilder.CreateCylinder(`nav${i}`, { diameter: cell * 0.85, height: cell * 0.04, tessellation: 14 }, scene);
      orb.isPickable = false;
      orb.metadata = { node: -1 };
      markers.push(orb);
    }
    return markers[slot];
  }
  function rebuildMarkers() { updateMarkers(); }
  const SHOW_WITHIN = cell * 9;
  // Editing works on the patch around where you stand: the whole island's
  // 1600-odd connections at once are impossible to aim at.
  const EDIT_WITHIN = cell * 12;
  const nearCur = (i) => {
    const a = nav.nodes[i].p, b = nav.nodes[cur].p;
    return Math.hypot(a[0] - b[0], a[1] - b[1], a[2] - b[2]) <= EDIT_WITHIN;
  };
  function updateMarkers() {
    const del = document.getElementById('del');
    if (del) del.hidden = !editMode || selected < 0;
    const near = new Set(nav.nodes[cur].n);
    const onRoute = new Set(route);
    const here = nav.nodes[cur].p;
    const radius = editMode ? EDIT_WITHIN : SHOW_WITHIN;
    shown = new Set();
    let slot = 0;
    for (let i = 0; i < nav.nodes.length; i++) {
      const key = i === cur || near.has(i) || onRoute.has(i) || i === selected;
      const p = nav.nodes[i].p;
      // Distant markers stay hidden so the scene reads as terrain, not dots.
      if (!key && Math.hypot(p[0] - here[0], p[1] - here[1], p[2] - here[2]) > radius) continue;
      const m = meshAt(slot++);
      m.metadata.node = i;
      m.position.set(p[0], p[1] + cell * 0.05, p[2]);
      m.material = i === selected ? selMat : i === cur ? hereMat : onRoute.has(i) ? routeMat : near.has(i) ? nearMat : farMat;
      m.renderingGroupId = key ? 1 : 0;
      m.scaling.setAll(key ? 1.3 : 1);
      m.setEnabled(true);
      shown.add(i);
    }
    for (let k = slot; k < markers.length; k++) markers[k].setEnabled(false);
    drawEdges();
  }

  // --- node editor ---------------------------------------------------------
  let editMode = false;
  let eraseMode = false;
  let selected = -1;
  let edgeMesh = null;
  const undoStack = [];
  function pushUndo() {
    undoStack.push(JSON.stringify(nav.nodes));
    if (undoStack.length > 25) undoStack.shift();
    document.getElementById('undo').disabled = false;
  }
  function undo() {
    if (!undoStack.length) return;
    nav.nodes = JSON.parse(undoStack.pop());
    if (cur >= nav.nodes.length) cur = 0;
    selected = -1; route = [];
    rebuildMarkers();
  }
  function drawEdges() {
    if (edgeMesh) { edgeMesh.dispose(); edgeMesh = null; }
    if (!editMode) return;
    const lines = [];
    nav.nodes.forEach((n, i) => {
      if (!nearCur(i)) return;
      for (const j of n.n) if (j > i && nearCur(j)) lines.push([
        new BABYLON.Vector3(n.p[0], n.p[1] + cell * 0.35, n.p[2]),
        new BABYLON.Vector3(nav.nodes[j].p[0], nav.nodes[j].p[1] + cell * 0.35, nav.nodes[j].p[2]),
      ]);
    });
    if (!lines.length) return;
    edgeMesh = BABYLON.MeshBuilder.CreateLineSystem('edges', { lines }, scene);
    edgeMesh.color = BABYLON.Color3.FromHexString('#7fe4ff');
    edgeMesh.alpha = 0.95;
    edgeMesh.isPickable = false;
  }
  function toggleEdge(a, b) {
    pushUndo();
    const na = nav.nodes[a], nb = nav.nodes[b];
    const i = na.n.indexOf(b);
    if (i >= 0) { na.n.splice(i, 1); nb.n.splice(nb.n.indexOf(a), 1); }
    else { na.n.push(b); nb.n.push(a); }
  }
  function addNode(point) {
    pushUndo();
    nav.nodes.push({ p: [+point.x.toFixed(3), +point.y.toFixed(3), +point.z.toFixed(3)], s: 'p', n: [] });
    const i = nav.nodes.length - 1;
    if (selected >= 0) toggleEdge(selected, i);
    selected = i;
    updateMarkers();
  }
  // Splices one node without rebuilding every marker, so tapping through a
  // dense lattice with the eraser stays responsive.
  function deleteNode(i) {
    pushUndo();
    for (const nb of nav.nodes[i].n) {
      const arr = nav.nodes[nb].n;
      const k = arr.indexOf(i);
      if (k >= 0) arr.splice(k, 1);
    }
    nav.nodes.splice(i, 1);
    for (const n of nav.nodes) n.n = n.n.map((j) => (j > i ? j - 1 : j));
    if (cur === i) cur = Math.min(i, nav.nodes.length - 1);
    else if (cur > i) cur--;
    if (cur < 0) cur = 0;
    selected = -1;
    route = [];
    if (nav.nodes.length) { camera.target = eyePoint(cur); updateMarkers(); }
  }
  function exportNav() {
    const blob = new Blob([JSON.stringify({ meta: { cell, eye }, nodes: nav.nodes })], { type: 'application/json' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = `${SCENE}_nav.json`;
    a.click();
  }
  function setEditMode(on) {
    editMode = on;
    mapView = on;
    if (!on) eraseMode = false;
    selected = -1;
    hud.innerHTML = on ? EDIT_HELP : VIEW_HELP;
    document.getElementById('edit').classList.toggle('on', on);
    document.getElementById('erase').classList.toggle('on', eraseMode);
    for (const id of ['save', 'erase', 'undo']) document.getElementById(id).hidden = !on;
    document.getElementById('undo').disabled = !undoStack.length;
    updateMarkers();
    glideTo(cur, 450);
  }

  // --- input ---------------------------------------------------------------
  let down = null;
  scene.onPointerObservable.add((info) => {
    const e = info.event;
    if (info.type === BABYLON.PointerEventTypes.POINTERDOWN) down = { x: e.clientX, y: e.clientY };
    if (info.type !== BABYLON.PointerEventTypes.POINTERUP || !down) return;
    const dx = e.clientX - down.x, dy = e.clientY - down.y;
    down = null;
    if (Math.hypot(dx, dy) < 40) {
      const tapped = markerAtScreen(scene.pointerX, scene.pointerY);
      if (editMode) {
        if (eraseMode) {
          // Connections radiate out of a node, so at a marker's centre the
          // nearest edge is also a hair away: comparing raw distances made a
          // tap on a dot cut a line instead of deleting the node. A tap
          // landing on the dot always means the dot; only further out does
          // the nearest line win.
          const nodeDist = tapped >= 0 ? lastTapDist : Infinity;
          const edge = edgeAtScreen(scene.pointerX, scene.pointerY);
          const edgeDist = edge ? lastEdgeDist : Infinity;
          if (nodeDist === Infinity && edgeDist === Infinity) return;
          if (nodeDist <= Math.max(ON_DOT_PX, edgeDist)) return deleteNode(tapped);
          return removeEdge(edge[0], edge[1]);
        }
        if (tapped >= 0) {
          const i = tapped;
          if (selected === -1) selected = i;
          else if (selected === i) selected = -1;
          else { toggleEdge(selected, i); selected = i; }
          updateMarkers();
        } else {
          const ground = scene.pick(scene.pointerX, scene.pointerY);
          if (ground?.hit) addNode(ground.pickedPoint);
        }
        return;
      }
      if (tapped >= 0) return travelTo(tapped);
      const ground = scene.pick(scene.pointerX, scene.pointerY);
      if (ground?.hit) travelTo(nearestNode(ground.pickedPoint));
    } else if (Math.abs(dx) > Math.abs(dy)) {
      orbit(dx > 0 ? -1 : 1);
    } else {
      setView(dy > 0 ? 1 : -1);
    }
  });
  addEventListener('keydown', (e) => {
    if (e.key === 'ArrowLeft') orbit(1);
    if (e.key === 'ArrowRight') orbit(-1);
    if (e.key === 'ArrowUp') walk(1);
    if (e.key === 'ArrowDown') walk(-1);
    if (e.key === 'PageUp') setView(1);
    if (e.key === 'PageDown') setView(-1);
    if (e.key === 'Backspace' && !editMode) { e.preventDefault(); goBack(); }
    if (e.key === 'e' || e.key === 'E') setEditMode(!editMode);
    if (editMode && (e.key === 'Delete' || e.key === 'Backspace') && selected >= 0) deleteNode(selected);
    if (editMode && (e.key === 'z' || e.key === 'Z')) undo();
  });
  let wheelAt = 0;
  addEventListener('wheel', (e) => {
    if (performance.now() - wheelAt < 350) return;
    wheelAt = performance.now();
    setView(e.deltaY > 0 ? 1 : -1);
  }, { passive: true });
  document.getElementById('back').addEventListener('click', goBack);
  document.getElementById('rotL').addEventListener('click', () => orbit(1));
  document.getElementById('rotR').addEventListener('click', () => orbit(-1));
  document.getElementById('tiltU').addEventListener('click', () => setView(1));
  document.getElementById('tiltD').addEventListener('click', () => setView(-1));
  document.getElementById('edit').addEventListener('click', () => setEditMode(!editMode));
  document.getElementById('del').addEventListener('click', () => { if (selected >= 0) deleteNode(selected); });
  document.getElementById('undo').addEventListener('click', undo);
  document.getElementById('erase').addEventListener('click', () => {
    eraseMode = !eraseMode;
    selected = -1;
    document.getElementById('erase').classList.toggle('on', eraseMode);
    updateMarkers();
  });
  document.getElementById('save').addEventListener('click', exportNav);

  hud.innerHTML = VIEW_HELP;
  rebuildMarkers();
  glideFacing(cur, 1);
  engine.runRenderLoop(() => scene.render());
  addEventListener('resize', () => engine.resize());
})().catch((e) => {
  hud.innerHTML = `<b>Failed to load</b><br><small>${e.message}<br>
Run <code>node tools/merge-scene.mjs scenes/${SCENE}.glb</code> first, and serve this page over HTTP.</small>`;
  throw e;
});
</script>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Modular Terrain — Walkthrough</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><text y='14' font-size='14'>⛰️</text></svg>">
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #1a2028; }
  canvas { width: 100%; height: 100%; display: block; touch-action: none; outline: none; }
  .hud {
    position: fixed; top: 12px; left: 12px; color: #dfe7ee; font: 13px/1.5 system-ui, sans-serif;
    background: rgba(20, 26, 34, 0.7); padding: 8px 12px; border-radius: 8px; pointer-events: none;
    max-width: 300px;
  }
  .hud b { font-size: 14px; }
  .hud small { opacity: 0.75; }
  .bar {
    position: fixed; bottom: 16px; left: 50%; transform: translateX(-50%);
    display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; max-width: calc(100vw - 24px);
    background: rgba(20, 26, 34, 0.75); padding: 8px; border-radius: 14px;
  }
  .bar button {
    width: 48px; height: 48px; border: 0; border-radius: 10px; background: #2c3644; color: #eef4fa;
    font-size: 20px; cursor: pointer; touch-action: manipulation;
  }
  .bar button:active { background: #3e4c5e; }
  .bar button.on { background: #7a5c1e; }
</style>
</head>
<body>
<canvas id="view"></canvas>
<div class="hud" id="hud"></div>
<div class="bar">
  <button id="back" title="Back to where you came from (Backspace)" disabled>&#8617;</button>
  <button id="rotL" title="Orbit left (&#8592;)">&#10226;</button>
  <button id="tiltU" title="Wider, higher view">&#9650;</button>
  <button id="tiltD" title="Closer, lower view">&#9660;</button>
  <button id="rotR" title="Orbit right (&#8594;)">&#10227;</button>
  <button id="edit" title="Review the walkable grid (E)">&#9998;</button>
  <button id="path" title="Record a path: tap start, then end (P)" hidden>&#8618;</button>
  <button id="undo" title="Undo last mark (Z)" hidden>&#8634;</button>
  <button id="save" title="Download the review JSON" hidden>&#128190;</button>
</div>
<script src="vendor/babylon/babylon.js"></script>
<script src="vendor/babylon/babylonjs.loaders.min.js"></script>
<script type="module">
import { buildIndex, raycast as castRay, castOwners } from './tools/ray.mjs';
import { isFade } from './tools/fade.mjs';

const SCENE = new URLSearchParams(location.search).get('scene') || 'Large_Island_v2_No_Ocean_No_Props';
const canvas = document.getElementById('view');
const hud = document.getElementById('hud');

const TAU = Math.PI * 2;
const STEPS = 8;
const STEP_ANGLE = TAU / STEPS;
const MAP_VIEW = { beta: 0.42, zoom: 0.55 };
const VIEWS = [
  { beta: 1.540, far: 4 },
  { beta: 1.470, far: 8 },
  { beta: 1.309, far: 16 },
  { beta: 1.134, far: 24 },
  { beta: 0.960, far: 48 },
];
const LEVEL = 1.55;
const BACK = 1.6;
const RATE = 9;
const KEEP_NEAR = 1.0;
const FADE_EASE = 4;
const RING = [[1, 0], [0, 1], [-1, 0], [0, -1], [0.7, 0.7], [-0.7, 0.7], [0.7, -0.7], [-0.7, -0.7]];
const SIGHT_RINGS = [[0.55, 0.78], [1.15, 0.42]];
const FADED = 0.1;
const smooth = (t) => t * t * (3 - 2 * t);
function damped(v, rate) {
  return {
    v, rate, easing: null,
    ease(ms) { if (this.v !== null) this.easing = { t0: performance.now(), ms, from: this.v }; },
    step(target, dt, rate = this.rate) {
      if (this.v === null) { this.v = target; this.easing = null; return this.v; }
      if (this.easing) {
        const t = Math.min((performance.now() - this.easing.t0) / this.easing.ms, 1);
        this.v = this.easing.from + (target - this.easing.from) * smooth(t);
        if (t === 1) this.easing = null;
      } else {
        const d = rate * dt;
        this.v += Math.max(-d, Math.min(d, target - this.v));
      }
      return this.v;
    },
  };
}

const VIEW_HELP = `<b>Walkthrough</b><br>
<small>Tap a cell or any spot to travel there<br>
Swipe &#8596; orbit &middot; swipe &#8597; or &#9650;/&#9660; closer/wider &middot; &#8617; back &middot; &#9998; review grid</small>`;
const WHERE = (n) => `<br><small>at ${n.p[0]},${n.p[2]} &middot; height ${n.p[1].toFixed(2)} &middot; ${n.n.length} way${n.n.length === 1 ? '' : 's'} out</small>`;

async function makeEngine() {
  if (navigator.gpu && BABYLON.WebGPUEngine) {
    try {
      const engine = new BABYLON.WebGPUEngine(canvas, { antialias: true });
      await engine.initAsync();
      return engine;
    } catch (e) { console.warn('WebGPU unavailable, falling back to WebGL', e); }
  }
  return new BABYLON.Engine(canvas, true);
}

function fromGrid(grid) {
  const { origin, materials, path } = grid.meta;
  const nodes = grid.nodes.map(([c, r, y, m, dx = 0, dz = 0]) => ({
    c, r,
    p: [origin.c + c + 0.5 + dx, y, origin.r + r + 0.5 + dz],
    s: path[m] ? 'p' : 'g',
    n: [],
  }));
  for (let i = 0; i < grid.edges.length; i += 2) {
    nodes[grid.edges[i]].n.push(grid.edges[i + 1]);
    nodes[grid.edges[i + 1]].n.push(grid.edges[i]);
  }
  return { meta: grid.meta, nodes, materials };
}

(async () => {
  const [engine, grid] = await Promise.all([
    makeEngine(),
    fetch(`scenes/${SCENE}_grid.json`).then((r) => r.json()),
  ]);
  const nav = fromGrid(grid);
  const { eye, cell } = nav.meta;
  const scene = new BABYLON.Scene(engine);
  scene.useRightHandedSystem = true;
  scene.clearColor = BABYLON.Color4.FromHexString('#1a2028ff');

  await BABYLON.SceneLoader.AppendAsync('scenes/', `${SCENE}_merged.glb`, scene);
  const faders = scene.meshes.filter((m) => m.getTotalVertices() > 0 && isFade(m.name));
  const terrain = scene.meshes.filter((m) => m.getTotalVertices() > 0 && !isFade(m.name));
  for (const mesh of scene.meshes) mesh.freezeWorldMatrix();
  for (const b of faders) b.viewFade = 1;
  const fadeOwner = [];
  const fadeIndex = faders.length ? buildIndex((() => {
    const parts = [];
    let total = 0;
    faders.forEach((mesh, slot) => {
      mesh.computeWorldMatrix(true);
      const wm = mesh.getWorldMatrix();
      const src = mesh.getVerticesData(BABYLON.VertexBuffer.PositionKind);
      const out = new Float32Array(src.length);
      const v = new BABYLON.Vector3();
      for (let i = 0; i < src.length; i += 3) {
        BABYLON.Vector3.TransformCoordinatesFromFloatsToRef(src[i], src[i + 1], src[i + 2], wm, v);
        out[i] = v.x; out[i + 1] = v.y; out[i + 2] = v.z;
      }
      for (let i = 0; i < src.length / 9; i++) fadeOwner.push(slot);
      parts.push(out);
      total += out.length;
    });
    const all = new Float32Array(total);
    let o = 0;
    for (const a of parts) { all.set(a, o); o += a.length; }
    return all;
  })(), cell) : null;
  const fadeOwners = Int32Array.from(fadeOwner);
  const fadeFlags = new Float32Array(faders.length);

  const sun = new BABYLON.DirectionalLight('sun', new BABYLON.Vector3(-0.5, -1, -0.35), scene);
  sun.intensity = 1.3;
  const sky = new BABYLON.HemisphericLight('sky', new BABYLON.Vector3(0, 1, 0), scene);
  sky.intensity = 1.2;
  sky.groundColor = new BABYLON.Color3(0.25, 0.22, 0.18);

  const index = buildIndex((() => {
    const parts = [];
    let total = 0;
    for (const mesh of terrain) {
      mesh.computeWorldMatrix(true);
      const wm = mesh.getWorldMatrix();
      const src = mesh.getVerticesData(BABYLON.VertexBuffer.PositionKind);
      const out = new Float32Array(src.length);
      const v = new BABYLON.Vector3();
      for (let i = 0; i < src.length; i += 3) {
        BABYLON.Vector3.TransformCoordinatesFromFloatsToRef(src[i], src[i + 1], src[i + 2], wm, v);
        out[i] = v.x; out[i + 1] = v.y; out[i + 2] = v.z;
      }
      parts.push(out);
      total += out.length;
    }
    const all = new Float32Array(total);
    let o = 0;
    for (const a of parts) { all.set(a, o); o += a.length; }
    return all;
  })(), cell);
  const raycast = (ox, oy, oz, dx, dy, dz, tMax) => castRay(index, ox, oy, oz, dx, dy, dz, tMax);

  const centroid = nav.nodes.reduce((a, n) => [a[0] + n.p[0], a[1] + n.p[2]], [0, 0]).map((v) => v / nav.nodes.length);
  const startScore = (n) => Math.hypot(n.p[0] - centroid[0], n.p[2] - centroid[1]) + (n.s === 'p' ? 0 : 30);
  const mainPatch = nav.meta.main ?? nav.nodes.length;
  const start = (() => {
    const order = nav.nodes.map((n, i) => i)
      .filter((i) => i < mainPatch)
      .sort((a, b) => startScore(nav.nodes[a]) - startScore(nav.nodes[b]));
    for (const i of order.slice(0, 400)) {
      const p = nav.nodes[i].p;
      if (raycast(p[0], p[1] + eye, p[2], 0, 1, 0, 80) === Infinity) return i;
    }
    return order[0];
  })();

  const asked = parseInt(new URLSearchParams(location.search).get('node') ?? '', 10);
  let cur = Number.isInteger(asked) && asked >= 0 && asked < nav.nodes.length ? asked : start;
  let stepCont = 0;
  let viewIdx = 1;
  let mapView = false;
  let mapZoom = 0.55;
  const view = () => (mapView ? MAP_VIEW : VIEWS[viewIdx]);
  const maxR = 66, margin = 0.3;
  const step = () => ((Math.round(stepCont) % STEPS) + STEPS) % STEPS;
  const eyePoint = (n) => new BABYLON.Vector3(nav.nodes[n].p[0], nav.nodes[n].p[1] + eye, nav.nodes[n].p[2]);
  const dirAt = (alpha, beta) => [Math.cos(alpha) * Math.sin(beta), Math.cos(beta), Math.sin(alpha) * Math.sin(beta)];

  function nearRadius() {
    const h = camera.minZ * Math.tan(camera.fov / 2);
    return Math.hypot(h, h * engine.getAspectRatio(camera)) + 0.12;
  }
  const perp = (dx, dy, dz) => {
    const ax = Math.abs(dy) < 0.9 ? [0, 1, 0] : [1, 0, 0];
    let ux = ax[1] * dz - ax[2] * dy, uy = ax[2] * dx - ax[0] * dz, uz = ax[0] * dy - ax[1] * dx;
    const ul = Math.hypot(ux, uy, uz) || 1;
    ux /= ul; uy /= ul; uz /= ul;
    return [[ux, uy, uz], [dy * uz - dz * uy, dz * ux - dx * uz, dx * uy - dy * ux]];
  };
  function thickCast(ox, oy, oz, dx, dy, dz, tMax, probe) {
    let best = raycast(ox, oy, oz, dx, dy, dz, tMax);
    const [u, v] = perp(dx, dy, dz);
    for (const [sx, sy, sz] of [u, v, [-u[0], -u[1], -u[2]], [-v[0], -v[1], -v[2]]]) {
      const hit = raycast(ox + sx * probe, oy + sy * probe, oz + sz * probe, dx, dy, dz, tMax);
      if (hit < best) best = hit;
    }
    return best;
  }

  function roomAt(n, k, beta) {
    const p = nav.nodes[n].p;
    const [dx, dy, dz] = dirAt(k * STEP_ANGLE, beta);
    return Math.min(maxR, thickCast(p[0], p[1] + eye, p[2], dx, dy, dz, maxR + margin, nearRadius()) - margin);
  }
  function fitBeta(n, k) {
    const want = view().beta;
    for (let b = want; b <= LEVEL + 1e-6; b += 0.09) if (roomAt(n, k, b) >= BACK) return b;
    return LEVEL;
  }
  function plan() {
    const beta = fitBeta(cur, step());
    return { beta, radius: Math.min(view().far, roomAt(cur, step(), beta)) };
  }
  const open = (n, k) => roomAt(n, ((k % STEPS) + STEPS) % STEPS, view().beta) > BACK;

  const camera = new BABYLON.ArcRotateCamera('cam', 0, view().beta, 1, eyePoint(start), scene);
  camera.minZ = 0.09;
  camera.maxZ = 1200;
  camera.fov = 0.9;
  camera.inputs.clear();

  let tween = null;
  const held = damped(null, RATE), heldBeta = damped(null, 2);
  let route = [];
  const history = [];
  let recording = true;
  function pushHistory(from) {
    if (history[history.length - 1] === from) return;
    history.push(from);
    if (history.length > 60) history.shift();
    const b = document.getElementById('back');
    if (b) b.disabled = false;
  }
  function goBack() {
    if (!history.length) return;
    route = [];
    const to = history.pop();
    const b = document.getElementById('back');
    if (b) b.disabled = !history.length;
    recording = false;
    stepCont = headingNear(to, Math.round(stepCont)) ?? Math.round(stepCont);
    glideTo(to, 420);
    recording = true;
  }
  function glideTo(node, ms) {
    if (recording && cur !== node) pushHistory(cur);
    cur = node;
    hud.innerHTML = helpText() + WHERE(nav.nodes[cur]);
    tween = {
      t0: performance.now(), ms,
      aT0: performance.now(), aMs: ms,
      target0: camera.target.clone(), target1: eyePoint(node),
      ground0: camera.target.y - eye, ground1: nav.nodes[node].p[1],
      alpha0: camera.alpha, alpha1: stepCont * STEP_ANGLE,
    };
    updateMarkers();
  }
  function glideFacing(node, ms) {
    const from = Math.round(stepCont);
    stepCont = headingNear(node, from) ?? from;
    glideTo(node, ms);
  }
  scene.onBeforeRenderObservable.add(() => {
    const dt = Math.min(engine.getDeltaTime(), 50) / 1000;
    if (tween) {
      const t = Math.min((performance.now() - tween.t0) / tween.ms, 1);
      const s = smooth(t);
      camera.target = BABYLON.Vector3.Lerp(tween.target0, tween.target1, s);
      camera.target.y = tween.ground0 + (tween.ground1 - tween.ground0) * s + eye;
      const sa = smooth(Math.min((performance.now() - tween.aT0) / tween.aMs, 1));
      camera.alpha = tween.alpha0 + (tween.alpha1 - tween.alpha0) * sa;
      if (t === 1) {
        tween = null;
        if (route.length) { const nxt = route.shift(); glideFacing(nxt, legMs(cur, nxt)); } else updateMarkers();
      }
    }
    if (mapView) {
      camera.beta += (MAP_VIEW.beta - camera.beta) * Math.min(1, dt * 6);
      const want = Math.max(2.4, maxR * mapZoom);
      camera.radius += (want - camera.radius) * Math.min(1, dt * 6);
      held.v = heldBeta.v = null;
      for (const b of faders) b.visibility = b.viewFade += (1 - b.viewFade) * (1 - Math.exp(-FADE_EASE * dt));
      return;
    }
    const want = plan();
    const rate = RATE + view().far;
    camera.beta = heldBeta.step(want.beta, dt);
    const back = held.step(want.radius, dt, rate);
    if (!tween) camera.target.y = nav.nodes[cur].p[1] + eye;
    const [dx, dy, dz] = dirAt(camera.alpha, camera.beta);
    const probe = nearRadius();
    const room = thickCast(camera.target.x, camera.target.y, camera.target.z, dx, dy, dz, back + margin, probe)
      - Math.hypot(camera.minZ, probe) * 1.3;
    camera.radius = Math.max(0, Math.min(back, room));
    held.v = Math.min(held.v, camera.radius + rate * dt);
    if (fadeIndex) {
      fadeFlags.fill(0);
      const reach = camera.radius + margin;
      if (reach > KEEP_NEAR) {
        const [u, v] = perp(dx, dy, dz);
        const ox = camera.target.x, oy = camera.target.y, oz = camera.target.z;
        castOwners(fadeIndex, ox, oy, oz, dx, dy, dz, reach, fadeOwners, fadeFlags, KEEP_NEAR, 1);
        for (const [r, w] of SIGHT_RINGS)
          for (const [a, c] of RING)
            castOwners(fadeIndex,
              ox + (u[0] * a + v[0] * c) * r,
              oy + (u[1] * a + v[1] * c) * r,
              oz + (u[2] * a + v[2] * c) * r,
              dx, dy, dz, reach, fadeOwners, fadeFlags, KEEP_NEAR, w);
      }
      faders.forEach((b, slot) => {
        const goal = 1 - fadeFlags[slot] * (1 - FADED);
        const vis = b.viewFade += (goal - b.viewFade) * (1 - Math.exp(-FADE_EASE * dt));
        b.visibility = vis;
        const mode = vis < 0.999 ? BABYLON.Material.MATERIAL_ALPHABLEND : BABYLON.Material.MATERIAL_OPAQUE;
        if (b.material.transparencyMode !== mode) b.material.transparencyMode = mode;
      });
    }
  });

  const dist3 = (a, b) => Math.hypot(b.p[0] - a.p[0], b.p[1] - a.p[1], b.p[2] - a.p[2]);
  const surf = { p: 1, g: 3.5 };
  const edgeCost = (a, b) => dist3(nav.nodes[a], nav.nodes[b]) * (((surf[nav.nodes[a].s] || 2) + (surf[nav.nodes[b].s] || 2)) / 2);
  const legMs = (a, b) => Math.max(16, dist3(nav.nodes[a], nav.nodes[b]) * 150);
  let byCell = new Map();
  const cellKey = (c, r) => c * 100000 + r;
  function indexCells() {
    byCell = new Map();
    nav.nodes.forEach((n, i) => {
      const k = cellKey(n.c, n.r);
      if (!byCell.has(k)) byCell.set(k, []);
      byCell.get(k).push(i);
    });
  }
  indexCells();
  function dijkstra(from, dest) {
    const dist = new Float64Array(nav.nodes.length).fill(Infinity);
    const prev = new Int32Array(nav.nodes.length).fill(-1);
    const done = new Uint8Array(nav.nodes.length);
    const heap = [];
    const push = (cost, node) => {
      heap.push([cost, node]);
      let i = heap.length - 1;
      while (i > 0) {
        const p = (i - 1) >> 1;
        if (heap[p][0] <= heap[i][0]) break;
        [heap[p], heap[i]] = [heap[i], heap[p]];
        i = p;
      }
    };
    const pop = () => {
      const top = heap[0], last = heap.pop();
      if (heap.length) {
        heap[0] = last;
        let i = 0;
        for (;;) {
          const l = i * 2 + 1, r = l + 1;
          let m = i;
          if (l < heap.length && heap[l][0] < heap[m][0]) m = l;
          if (r < heap.length && heap[r][0] < heap[m][0]) m = r;
          if (m === i) break;
          [heap[m], heap[i]] = [heap[i], heap[m]];
          i = m;
        }
      }
      return top;
    };
    dist[from] = 0;
    push(0, from);
    while (heap.length) {
      const [, n] = pop();
      if (done[n]) continue;
      done[n] = 1;
      if (n === dest) break;
      for (const nb of nav.nodes[n].n) {
        const d = dist[n] + edgeCost(n, nb);
        if (d < dist[nb]) { dist[nb] = d; prev[nb] = n; push(d, nb); }
      }
    }
    return { dist, prev };
  }
  function stepsBetween(from, dest) {
    if (from === dest) return 0;
    const { dist, prev } = dijkstra(from, dest);
    if (dist[dest] === Infinity) return null;
    let steps = 0;
    for (let n = dest; n !== from && n !== -1; n = prev[n]) steps++;
    return steps;
  }
  function travelTo(dest) {
    if (dest === cur) return;
    const { dist, prev } = dijkstra(cur, dest);
    if (dist[dest] === Infinity) {
      const to = nav.nodes[dest].p;
      let best = -1, bestD = Infinity;
      for (let i = 0; i < nav.nodes.length; i++) {
        if (dist[i] === Infinity) continue;
        const p = nav.nodes[i].p;
        const d = Math.hypot(p[0] - to[0], p[1] - to[1], p[2] - to[2]);
        if (d < bestD) { bestD = d; best = i; }
      }
      if (best < 0 || best === cur) { route = []; return; }
      dest = best;
    }
    route = [];
    for (let n = dest; n !== -1; n = prev[n]) route.unshift(n);
    route.shift();
    if (route.length) { const nxt = route.shift(); glideFacing(nxt, legMs(cur, nxt)); }
  }
  const TAP_PX = 32;
  function markerAtScreen(px, py) {
    const eng = engine;
    const vp = camera.viewport.toGlobal(eng.getRenderWidth(), eng.getRenderHeight());
    const xform = scene.getTransformMatrix();
    const ident = BABYLON.Matrix.Identity();
    const scale = eng.getRenderWidth() / (canvas.clientWidth || eng.getRenderWidth());
    const limit = TAP_PX * scale;
    let best = -1, bestScore = Infinity;
    for (const i of shown) {
      const q = nav.nodes[i].p;
      const p = BABYLON.Vector3.Project(new BABYLON.Vector3(q[0], q[1] + LIFT, q[2]), ident, xform, vp);
      if (p.z <= 0 || p.z >= 1) continue;
      const d = Math.hypot(p.x - px * scale, p.y - py * scale);
      if (d > limit) continue;
      const score = d + p.z * limit;
      if (score < bestScore) { bestScore = score; best = i; }
    }
    return best;
  }

  function nearestNode(point) {
    let best = 0, bestD = Infinity;
    nav.nodes.forEach((n, i) => {
      const d = Math.hypot(n.p[0] - point.x, (n.p[1] - point.y) * 2, n.p[2] - point.z);
      if (d < bestD) { bestD = d; best = i; }
    });
    return best;
  }
  function headingNear(node, from, maxTurn = STEPS / 2, dir = 0) {
    for (let d = dir ? 1 : 0; d <= maxTurn; d++)
      for (const k of d === 0 ? [from] : dir ? [from + dir * d] : [from + d, from - d])
        if (open(node, k)) return k;
    return null;
  }
  const orbit = (dir) => {
    const from = Math.round(stepCont);
    const k = headingNear(cur, from, STEPS - 1, dir) ?? from + dir;
    const steps = Math.abs(k - from);
    stepCont = k;
    if (tween && route.length) {
      tween.alpha0 = camera.alpha;
      tween.alpha1 = stepCont * STEP_ANGLE;
      tween.aT0 = performance.now();
      tween.aMs = 320;
      return;
    }
    glideTo(cur, Math.min(300 + 120 * steps, 700));
  };
  const setView = (dir) => {
    if (mapView) {
      mapZoom = Math.min(1.8, Math.max(0.18, mapZoom * (dir > 0 ? 1.4 : 1 / 1.4)));
      glideTo(cur, 260);
      return;
    }
    const next = Math.min(VIEWS.length - 1, Math.max(0, viewIdx + dir));
    if (next === viewIdx) return;
    viewIdx = next;
    held.ease(420); heldBeta.ease(420);
    if (tween || route.length) return;
    stepCont = headingNear(cur, Math.round(stepCont), STEPS - 1) ?? stepCont;
    glideTo(cur, 400);
  };
  function walk(sign) {
    route = [];
    const fwd = camera.target.subtract(camera.position); fwd.y = 0; fwd.normalize();
    let best = -1, bestDot = 0.35;
    for (const nb of nav.nodes[cur].n) {
      const to = eyePoint(nb).subtract(camera.target); to.y = 0;
      const d = sign * BABYLON.Vector3.Dot(to.normalize(), fwd);
      if (d > bestDot) { bestDot = d; best = nb; }
    }
    if (best >= 0) {
      const k = Math.round(stepCont);
      stepCont = headingNear(best, k, 1) ?? k;
      glideTo(best, 500);
    }
  }

  const mat = (hex, alpha) => {
    const m = new BABYLON.StandardMaterial('m' + hex, scene);
    m.emissiveColor = BABYLON.Color3.FromHexString(hex);
    m.disableLighting = true;
    if (alpha) m.alpha = alpha;
    return m;
  };
  const nearMat = mat('#ffd75e'), farMat = mat('#b9c8d6', 0.5), hereMat = mat('#7ee081');
  const routeMat = mat('#ff9d47'), selMat = mat('#5ed7ff');
  const missMat = mat('#ff5ec8'), wrongMat = mat('#ff4d4d'), pathMat = mat('#ffb347');
  for (const m of [nearMat, hereMat, routeMat, selMat, missMat, wrongMat, pathMat]) m.disableDepthWrite = true;
  const PAD = 0.72;
  const LIFT = 0.05;
  const padOf = (material, key) => {
    const m = BABYLON.MeshBuilder.CreateCylinder('pad', { diameter: PAD, height: 0.04, tessellation: 14 }, scene);
    m.material = material;
    m.isPickable = false;
    m.renderingGroupId = key ? 1 : 0;
    m.alwaysSelectAsActiveMesh = true;
    m.thinInstanceCount = 0;
    return m;
  };
  const pads = {
    far: padOf(farMat, false),
    near: padOf(nearMat, true),
    here: padOf(hereMat, true),
    route: padOf(routeMat, true),
    sel: padOf(selMat, true),
    path: padOf(pathMat, true),
    missing: padOf(missMat, true),
    wrong: padOf(wrongMat, true),
  };
  const padBuf = {};
  function setPads(kind, list, scale) {
    const mesh = pads[kind];
    let buf = padBuf[kind];
    if (!buf || buf.length < list.length * 16) buf = padBuf[kind] = new Float32Array(Math.max(16, list.length * 16) * 2);
    list.forEach((p, k) => {
      const o = k * 16;
      buf[o] = scale; buf[o + 5] = scale; buf[o + 10] = scale; buf[o + 15] = 1;
      buf[o + 1] = buf[o + 2] = buf[o + 3] = buf[o + 4] = buf[o + 6] = buf[o + 7] = 0;
      buf[o + 8] = buf[o + 9] = buf[o + 11] = 0;
      buf[o + 12] = p[0]; buf[o + 13] = p[1] + LIFT; buf[o + 14] = p[2];
    });
    mesh.thinInstanceSetBuffer('matrix', buf, 16, false);
    mesh.thinInstanceCount = list.length;
    mesh.setEnabled(list.length > 0);
  }

  let shown = new Set();
  function rebuildMarkers() { updateMarkers(); }
  const SHOW_WITHIN = 18;
  const EDIT_WITHIN_BASE = 22;
  const editWithin = () => Math.min(48, Math.max(20, EDIT_WITHIN_BASE * (mapZoom / 0.55)));
  const nearCur = (i) => {
    const a = nav.nodes[i].p, b = nav.nodes[cur].p;
    return Math.hypot(a[0] - b[0], a[1] - b[1], a[2] - b[2]) <= editWithin();
  };
  function updateMarkers() {
    const near = new Set(nav.nodes[cur].n);
    const onRoute = new Set(route);
    const here = nav.nodes[cur].p;
    const radius = editMode ? editWithin() : SHOW_WITHIN;
    const lists = { far: [], near: [], here: [], route: [], sel: [] };
    shown = new Set();
    const kindOf = (i) => (i === selected ? 'sel' : i === cur ? 'here' : onRoute.has(i) ? 'route' : near.has(i) ? 'near' : 'far');
    const add = (i) => { if (shown.has(i)) return; lists[kindOf(i)].push(i); shown.add(i); };
    const span = Math.ceil(radius);
    const home = nav.nodes[cur];
    for (let dc = -span; dc <= span; dc++) {
      for (let dr = -span; dr <= span; dr++) {
        const bucket = byCell.get(cellKey(home.c + dc, home.r + dr));
        if (!bucket) continue;
        for (const i of bucket) {
          const p = nav.nodes[i].p;
          if (Math.hypot(p[0] - here[0], p[1] - here[1], p[2] - here[2]) > radius) continue;
          add(i);
        }
      }
    }
    add(cur);
    for (const i of near) add(i);
    for (const i of route) add(i);
    if (selected >= 0) add(selected);
    const at = (i) => nav.nodes[i].p;
    for (const kind of Object.keys(lists)) setPads(kind, lists[kind].map(at), kind === 'far' ? 0.62 : 1.25);
    const missing = [], wrong = [], ends = [];
    if (editMode) {
      for (const m of marks.nodes.values()) {
        if (!nearMark(m)) continue;
        (m.kind === 'missing' ? missing : wrong).push([m.x, m.y, m.z]);
      }
      for (const q of paths) for (const e of [q.start, q.end]) if (nearMark(e)) ends.push([e.x, e.y, e.z]);
    }
    setPads('missing', missing, 1.5);
    setPads('wrong', wrong, 1.5);
    setPads('path', ends, 1.5);
    drawEdges();
    hud.innerHTML = helpText() + WHERE(nav.nodes[cur]);
  }

  let editMode = false;
  let pathMode = false;
  let selected = -1;
  let edgeMesh = null;
  let missMesh = null;
  let wrongMesh = null;
  const marks = { nodes: new Map(), links: new Map() };
  const paths = [];
  const countKind = (kind) =>
    [...marks.nodes.values()].filter((m) => m.kind === kind).length
    + [...marks.links.values()].filter((m) => m.kind === kind).length;
  const refOf = (i) => {
    const n = nav.nodes[i];
    return { c: n.c, r: n.r, y: +n.p[1].toFixed(3), x: n.p[0], z: n.p[2] };
  };
  const refKey = (a) => `${a.c},${a.r},${a.y.toFixed(2)}`;
  const linkKey = (a, b) => [refKey(a), refKey(b)].sort().join('|');
  const nearMark = (m) => {
    const b = nav.nodes[cur].p;
    return Math.hypot(m.x - b[0], m.y - b[1], m.z - b[2]) <= editWithin();
  };
  const EDIT_HELP = () => `<b>Grid review</b><br>
<small>Nothing here changes the grid &mdash; it records what is wrong with it.<br>
Tap a cell, then that same cell again: it should not be walkable<br>
Tap open ground: a cell is missing there<br>
Tap a cell, then a touching one: that link is missing, or wrong if it exists<br>
Tap clear of the cells to drop the one you tapped first<br>
Tap anything marked again to unmark it &middot; &#8634; undo<br>
&#128190; downloads ${SCENE}_grid.review.json</small>`;
  const PATH_HELP = () => `<b>Path recorder</b><br>
<small>Tap the cell to start from, then the cell to reach.<br>
Its start, its end and the steps between them are recorded.<br>
Tap the start again to cancel &middot; &#8618; back to marking</small>`;
  const TALLY = () => `<br><small>${countKind('missing')} missing &middot; ${countKind('wrong')} wrong &middot; ${paths.length} path${paths.length === 1 ? '' : 's'}</small>`;
  const helpText = () => (!editMode ? VIEW_HELP : (pathMode ? PATH_HELP() : EDIT_HELP()) + TALLY());

  const undoStack = [];
  const snapshot = () => JSON.stringify({ n: [...marks.nodes], l: [...marks.links], p: paths });
  function pushUndo() {
    undoStack.push(snapshot());
    if (undoStack.length > 50) undoStack.shift();
    document.getElementById('undo').disabled = false;
  }
  function undo() {
    if (!undoStack.length) return;
    const was = JSON.parse(undoStack.pop());
    marks.nodes = new Map(was.n);
    marks.links = new Map(was.l);
    paths.length = 0;
    paths.push(...was.p);
    selected = -1;
    document.getElementById('undo').disabled = !undoStack.length;
    updateMarkers();
  }
  function lineSystem(name, lines, hex) {
    if (!lines.length) return null;
    const m = BABYLON.MeshBuilder.CreateLineSystem(name, { lines }, scene);
    m.color = BABYLON.Color3.FromHexString(hex);
    m.alpha = 0.95;
    m.isPickable = false;
    return m;
  }
  function drawEdges() {
    for (const m of [edgeMesh, missMesh, wrongMesh]) if (m) m.dispose();
    edgeMesh = missMesh = wrongMesh = null;
    if (!editMode) return;
    const lines = [];
    nav.nodes.forEach((n, i) => {
      if (!nearCur(i)) return;
      for (const j of n.n) if (j > i && nearCur(j)) lines.push([
        new BABYLON.Vector3(n.p[0], n.p[1] + 0.35, n.p[2]),
        new BABYLON.Vector3(nav.nodes[j].p[0], nav.nodes[j].p[1] + 0.35, nav.nodes[j].p[2]),
      ]);
    });
    edgeMesh = lineSystem('edges', lines, '#7fe4ff');
    const miss = [], bad = [];
    for (const l of marks.links.values()) {
      if (!nearMark(l.a) && !nearMark(l.b)) continue;
      (l.kind === 'missing' ? miss : bad).push([
        new BABYLON.Vector3(l.a.x, l.a.y + 0.45, l.a.z),
        new BABYLON.Vector3(l.b.x, l.b.y + 0.45, l.b.z),
      ]);
    }
    missMesh = lineSystem('missing', miss, '#ff5ec8');
    wrongMesh = lineSystem('wrong', bad, '#ff4d4d');
  }
  const linkable = (a, b) => {
    const x = nav.nodes[a], y = nav.nodes[b];
    return Math.abs(x.c - y.c) <= 1 && Math.abs(x.r - y.r) <= 1 && !(x.c === y.c && x.r === y.r);
  };
  function markNode(ref, kind) {
    const k = refKey(ref);
    pushUndo();
    if (marks.nodes.has(k)) marks.nodes.delete(k);
    else marks.nodes.set(k, { ...ref, kind });
  }
  function markLink(a, b, kind) {
    const k = linkKey(a, b);
    pushUndo();
    if (marks.links.has(k)) marks.links.delete(k);
    else marks.links.set(k, { a, b, kind });
  }
  function markPair(a, b) {
    const wrong = nav.nodes[a].n.includes(b);
    if (!wrong && !linkable(a, b)) return false;
    markLink(refOf(a), refOf(b), wrong ? 'wrong' : 'missing');
    return true;
  }
  const O = () => nav.meta.origin;
  function cellOf(point) {
    const c = Math.floor(point.x - O().c), r = Math.floor(point.z - O().r);
    const x = O().c + c + 0.5, z = O().r + r + 0.5;
    const from = point.y + 2.7;
    const hit = raycast(x, from, z, 0, -1, 0, 12);
    return { c, r, x, z, y: hit === Infinity ? point.y : from - hit };
  }
  function markCell(raw) {
    const at = cellOf(raw);
    const here = [...marks.nodes.entries()]
      .find(([, m]) => m.c === at.c && m.r === at.r && Math.abs(m.y - at.y) < nav.meta.step);
    pushUndo();
    if (here) marks.nodes.delete(here[0]);
    else {
      const ref = { c: at.c, r: at.r, y: +at.y.toFixed(3), x: at.x, z: at.z };
      marks.nodes.set(refKey(ref), { ...ref, kind: 'missing' });
    }
  }
  function recordPath(from, to) {
    const steps = stepsBetween(from, to);
    pushUndo();
    paths.push({ start: refOf(from), end: refOf(to), steps, reachable: steps !== null });
  }
  const cellRef = ({ c, r, y }) => ({ c, r, y });
  function review() {
    const nodes = [...marks.nodes.values()];
    const links = [...marks.links.values()];
    const of = (kind) => ({
      cells: nodes.filter((m) => m.kind === kind).map(cellRef),
      links: links.filter((m) => m.kind === kind).map((m) => [cellRef(m.a), cellRef(m.b)]),
    });
    return {
      scene: SCENE,
      grid: `${SCENE}_grid.json`,
      recorded: new Date().toISOString(),
      origin: nav.meta.origin,
      cell: nav.meta.cell,
      missing: of('missing'),
      wrong: of('wrong'),
      paths: paths.map((q) => ({
        start: cellRef(q.start), end: cellRef(q.end), steps: q.steps, reachable: q.reachable,
      })),
    };
  }
  function exportReview() {
    const blob = new Blob([JSON.stringify(review(), null, 2)], { type: 'application/json' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = `${SCENE}_grid.review.json`;
    a.click();
  }
  function setEditMode(on) {
    editMode = on;
    mapView = on;
    if (on) mapZoom = 0.55;
    if (!on) pathMode = false;
    selected = -1;
    document.getElementById('edit').classList.toggle('on', on);
    document.getElementById('path').classList.toggle('on', pathMode);
    for (const id of ['save', 'path', 'undo']) document.getElementById(id).hidden = !on;
    document.getElementById('undo').disabled = !undoStack.length;
    updateMarkers();
    glideTo(cur, 450);
  }
  function setPathMode(on) {
    pathMode = on;
    selected = -1;
    document.getElementById('path').classList.toggle('on', on);
    updateMarkers();
  }

  let down = null;
  scene.onPointerObservable.add((info) => {
    const e = info.event;
    if (info.type === BABYLON.PointerEventTypes.POINTERDOWN) down = { x: e.clientX, y: e.clientY };
    if (info.type !== BABYLON.PointerEventTypes.POINTERUP || !down) return;
    const dx = e.clientX - down.x, dy = e.clientY - down.y;
    down = null;
    if (Math.hypot(dx, dy) < 40) {
      const tapped = markerAtScreen(scene.pointerX, scene.pointerY);
      if (editMode) {
        if (pathMode) {
          let i = tapped;
          if (i < 0) {
            const ground = scene.pick(scene.pointerX, scene.pointerY);
            if (ground?.hit) i = nearestNode(ground.pickedPoint);
          }
          if (i < 0) return;
          if (selected === -1) selected = i;
          else if (selected === i) selected = -1;
          else { recordPath(selected, i); selected = -1; }
          updateMarkers();
          return;
        }
        if (tapped >= 0) {
          if (selected === -1) selected = tapped;
          else if (selected === tapped) { markNode(refOf(tapped), 'wrong'); selected = -1; }
          else if (markPair(selected, tapped)) selected = -1;
          else selected = tapped;
          updateMarkers();
          return;
        }
        if (selected >= 0) { selected = -1; updateMarkers(); return; }
        const ground = scene.pick(scene.pointerX, scene.pointerY);
        if (ground?.hit) { markCell(ground.pickedPoint); updateMarkers(); }
        return;
      }
      if (tapped >= 0) return travelTo(tapped);
      const ground = scene.pick(scene.pointerX, scene.pointerY);
      if (ground?.hit) travelTo(nearestNode(ground.pickedPoint));
    } else if (Math.abs(dx) > Math.abs(dy)) {
      orbit(dx > 0 ? -1 : 1);
    } else {
      setView(dy > 0 ? 1 : -1);
    }
  });
  addEventListener('keydown', (e) => {
    if (e.key === 'ArrowLeft') orbit(1);
    if (e.key === 'ArrowRight') orbit(-1);
    if (e.key === 'ArrowUp') walk(1);
    if (e.key === 'ArrowDown') walk(-1);
    if (e.key === 'PageUp') setView(1);
    if (e.key === 'PageDown') setView(-1);
    if (e.key === 'Backspace' && !editMode) { e.preventDefault(); goBack(); }
    if (e.key === 'e' || e.key === 'E') setEditMode(!editMode);
    if (editMode && (e.key === 'p' || e.key === 'P')) setPathMode(!pathMode);
    if (editMode && e.key === 'Escape' && selected >= 0) { selected = -1; updateMarkers(); }
    if (editMode && (e.key === 'z' || e.key === 'Z')) undo();
  });
  let wheelAt = 0;
  addEventListener('wheel', (e) => {
    if (performance.now() - wheelAt < 350) return;
    wheelAt = performance.now();
    setView(e.deltaY > 0 ? 1 : -1);
  }, { passive: true });
  document.getElementById('back').addEventListener('click', goBack);
  document.getElementById('rotL').addEventListener('click', () => orbit(1));
  document.getElementById('rotR').addEventListener('click', () => orbit(-1));
  document.getElementById('tiltU').addEventListener('click', () => setView(1));
  document.getElementById('tiltD').addEventListener('click', () => setView(-1));
  document.getElementById('edit').addEventListener('click', () => setEditMode(!editMode));
  document.getElementById('undo').addEventListener('click', undo);
  document.getElementById('path').addEventListener('click', () => setPathMode(!pathMode));
  document.getElementById('save').addEventListener('click', exportReview);

  hud.innerHTML = helpText() + WHERE(nav.nodes[cur]);
  rebuildMarkers();
  glideFacing(cur, 1);
  engine.runRenderLoop(() => scene.render());
  addEventListener('resize', () => engine.resize());
})().catch((e) => {
  hud.innerHTML = `<b>Failed to load</b><br><small>${e.message}<br>
Run <code>node tools/merge-scene.mjs scenes/${SCENE}.glb</code> and\n<code>node tools/build-grid.mjs scenes/${SCENE}.glb</code> first, and serve this page over HTTP.</small>`;
  throw e;
});
</script>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Modular Terrain — 3D Catalog</title>
<meta name="description" content="Browsable catalog of 290 models from a modular terrain pack: cliffs, walls, cracked cliffs, terrain paths, grass, sand, water, and props — by part, shape, layer, and grid size, plus the pack's own assemblies rebuilt from those pieces.">
<meta name="catalog-version" content="ef05fb8383">
<link rel="stylesheet" href="catalog/catalog.css?v=ef05fb8383">
<link rel="stylesheet" href="catalog/builder.css?v=ef05fb8383">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><text y='14' font-size='14'>⛰️</text></svg>">
</head>
<body>

<header class="head">
  <div class="head-title">
    <div class="head-title-row">
      <h1 class="offscreen">Modular Terrain — 3D Catalog</h1>
    </div>
    <p class="head-sub" id="summary" hidden></p>
  </div>

  <div class="tab-bar" id="tab-bar" role="tablist" aria-label="View"></div>
</header>

<div class="filter-bar" id="filter-bar">
  <div class="filter-swatches" id="filter-swatches" role="group" aria-label="Filter by material"></div>
  <button class="filter-clear" id="filter-clear" disabled>Clear</button>
</div>

<main id="panel" role="tabpanel"></main>

<div class="builder" id="builder" hidden></div>

<template id="builder-template">
  <div class="viewport"><canvas data-role="view" aria-label="Build view"></canvas></div>

  <div class="hud hud-top">
    <p class="brush" data-role="brush"></p>
    <button type="button" data-role="rotate" data-icon title="Rotate (R)"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12a9 9 0 1 1-9-9c2.52 0 4.93 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/></svg></button>
    <button type="button" data-role="mirror" data-icon aria-pressed="false" title="Mirror (M)"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m3 7 5 5-5 5V7"/><path d="m21 7-5 5 5 5V7"/><path d="M12 3v2m0 4v2m0 4v2m0 4v2"/></svg></button>
    <span class="stepper">
      <button type="button" data-role="down" aria-label="Lower level">&minus;</button>
      <span class="level" data-role="level" title="Build level">0</span>
      <button type="button" data-role="up" aria-label="Raise level">+</button>
    </span>
    <button type="button" data-role="remove" data-icon title="Remove the selected piece" disabled><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 6h18"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"/><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><path d="M10 11v6M14 11v6"/></svg></button>
    <button type="button" data-role="undo" data-icon title="Undo" disabled><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 14 4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 0 1 0 11H11"/></svg></button>
    <button type="button" data-role="redo" data-icon title="Redo" disabled><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m15 14 5-5-5-5"/><path d="M20 9H9.5a5.5 5.5 0 0 0 0 11H13"/></svg></button>
    <button type="button" data-role="clear" data-icon title="Clear the board"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg></button>
  </div>

  <div class="hud hud-move">
    <button type="button" class="move-away" data-role="move-away" data-icon aria-label="Move the piece away" disabled><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6 15 6-6 6 6"/></svg></button>
    <button type="button" class="move-left" data-role="move-left" data-icon aria-label="Move the piece left" disabled><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m15 6-6 6 6 6"/></svg></button>
    <button type="button" class="move-place" data-role="place" data-icon title="Place the piece here (Enter)" disabled><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 6 9 17l-5-5"/></svg></button>
    <button type="button" class="move-right" data-role="move-right" data-icon aria-label="Move the piece right" disabled><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m9 6 6 6-6 6"/></svg></button>
    <button type="button" class="move-near" data-role="move-near" data-icon aria-label="Move the piece nearer" disabled><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg></button>
  </div>

  <div class="hud hud-save" data-role="save" data-open="false">
    <button type="button" data-role="save-toggle" data-icon aria-expanded="false" aria-label="Save, export or open a build"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="m7 10 5 5 5-5"/><path d="M12 15V3"/></svg></button>
    <span class="save-more">
      <button type="button" data-role="save-json" title="Save the build as JSON">JSON</button>
      <button type="button" data-role="save-glb" title="Export the build as GLB">GLB</button>
      <label class="open" title="Open a saved build">
        Open<input type="file" data-role="open" accept="application/json,.json" hidden>
      </label>
    </span>
  </div>

  <div class="hud hud-views">
    <button type="button" data-role="view-top" title="Top view">Top</button>
    <button type="button" data-role="view-iso" title="Angled view">Iso</button>
    <button type="button" data-role="view-front" title="Front view">Front</button>
    <button type="button" data-role="sockets" data-icon aria-pressed="true" title="Show socket faces"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2 3 7v10l9 5 9-5V7Z"/><path d="M3 7l9 5 9-5"/><path d="M12 12v10"/></svg></button>
    <span class="hud-split"></span>
    <button type="button" data-role="orbit-left" data-icon aria-label="Turn left"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 12a9 9 0 1 0 9-9c-2.52 0-4.93 1-6.74 2.74L3 8"/><path d="M3 3v5h5"/></svg></button>
    <button type="button" data-role="orbit-right" data-icon aria-label="Turn right"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12a9 9 0 1 1-9-9c2.52 0 4.93 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/></svg></button>
    <button type="button" data-role="zoom-in" data-icon aria-label="Zoom in"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/><path d="M11 8v6M8 11h6"/></svg></button>
    <button type="button" data-role="zoom-out" data-icon aria-label="Zoom out"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/><path d="M8 11h6"/></svg></button>
  </div>

  <div class="drawer" data-role="drawer" data-height="half">
    <div class="drawer-tabs" role="tablist">
      <button type="button" role="tab" data-role="tab-pieces" aria-selected="true">Pieces</button>
      <button type="button" role="tab" data-role="tab-inspect" aria-selected="false">Piece</button>
      <select data-role="family" aria-label="Filter pieces"></select>
      <button type="button" data-role="drawer-size" data-icon aria-label="Resize the panel"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m18 15-6-6-6 6"/></svg></button>
    </div>

    <div class="drawer-body">
      <section class="palette" data-role="panel-pieces" role="tabpanel">
        <ul class="palette-list" data-role="list"></ul>
      </section>

      <section class="inspect" data-role="panel-inspect" role="tabpanel" hidden></section>
    </div>
  </div>
</template>

<p class="empty" id="empty" hidden>No models found.</p>

<dialog class="detail" id="detail">
  <button class="detail-close" id="detail-close" aria-label="Close">&times;</button>
  <div class="detail-viewer" id="detail-viewer"></div>
  <div class="detail-info">
    <h2 id="detail-name"></h2>
    <p class="detail-origin" id="detail-origin"></p>
    <div class="detail-traits" id="detail-traits"></div>
    <dl id="detail-data"></dl>
    <div class="detail-actions">
      <button id="detail-copy">Copy path</button>
      <button id="detail-select" aria-pressed="false">Add to selection</button>
      <a id="detail-download" download>Download .glb</a>
    </div>
  </div>
</dialog>

<div class="selection-bar" id="selection-bar" hidden>
  <span class="selection-count" id="selection-count" aria-live="polite"></span>
  <button type="button" id="select-visible">Select all visible</button>
  <button type="button" id="selection-copy" class="primary">Copy paths</button>
  <button type="button" id="select-clear">Clear</button>
</div>

<script type="importmap">
{ "imports": { "three": "./vendor/three/build/three.module.min.js" } }
</script>
<script src="vendor/model-viewer.min.js" type="module"></script>
<script src="catalog/catalog.js?v=ef05fb8383" type="module"></script>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Modular Terrain — 3D Catalog</title>
<meta name="description" content="Browsable catalog of 287 models from a modular terrain pack: cliffs, walls, cracked cliffs, terrain paths, grass, sand, water, a cave, and props — by part, shape, layer, and grid size.">
<meta name="catalog-version" content="b9f757f345">
<link rel="stylesheet" href="catalog/catalog.css?v=b9f757f345">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><text y='14' font-size='14'>⛰️</text></svg>">
</head>
<body>

<header class="head">
  <div class="head-title">
    <h1>Modular Terrain — 3D Catalog</h1>
    <p class="head-sub" id="summary" hidden></p>
  </div>

  <div class="tab-bar" id="tab-bar" role="tablist" aria-label="View"></div>
</header>

<nav class="jump-list" id="jump-list" aria-label="Jump to section"></nav>

<div class="filter-bar" id="filter-bar">
  <div class="filter-bar-head">
    <span class="filter-label">Filter</span>
    <button class="filter-clear" id="filter-clear" hidden>Clear filters</button>
  </div>
  <div class="filter-swatches" id="filter-swatches" role="group" aria-label="Filter by material"></div>
</div>

<main id="panel" role="tabpanel"></main>

<p class="empty" id="empty" hidden>No models found.</p>

<dialog class="detail" id="detail">
  <button class="detail-close" id="detail-close" aria-label="Close">&times;</button>
  <div class="detail-viewer" id="detail-viewer"></div>
  <div class="detail-info">
    <h2 id="detail-name"></h2>
    <p class="detail-origin" id="detail-origin"></p>
    <div class="detail-traits" id="detail-traits"></div>
    <dl id="detail-data"></dl>
    <div class="detail-actions">
      <button id="detail-copy">Copy path</button>
      <button id="detail-select" aria-pressed="false">Add to selection</button>
      <a id="detail-download" download>Download .glb</a>
    </div>
  </div>
</dialog>

<div class="selection-bar" id="selection-bar" hidden>
  <span class="selection-count" id="selection-count" aria-live="polite"></span>
  <button type="button" id="select-visible">Select all visible</button>
  <button type="button" id="selection-copy" class="primary">Copy paths</button>
  <button type="button" id="select-clear">Clear</button>
</div>

<script src="vendor/model-viewer.min.js" type="module"></script>
<script src="catalog/catalog.js?v=b9f757f345" type="module"></script>
</body>
</html>

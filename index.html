<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Modular Terrain — 3D Catalog</title>
<meta name="description" content="Browsable catalog of 270 models from a modular terrain pack: cliffs, walls, cracked cliffs, terrain paths, grass, sand, water, and props — by part, shape, layer, and grid size, plus the pack's own assemblies rebuilt from those pieces.">
<meta name="catalog-version" content="3b6140ff39">
<link rel="stylesheet" href="catalog/catalog.css?v=3b6140ff39">
<link rel="stylesheet" href="catalog/builder.css?v=3b6140ff39">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><text y='14' font-size='14'>⛰️</text></svg>">
</head>
<body>

<header class="head">
  <div class="head-title">
    <div class="head-title-row">
      <h1 class="offscreen">Modular Terrain — 3D Catalog</h1>
    </div>
    <p class="head-sub" id="summary" hidden></p>
  </div>

  <div class="tab-bar" id="tab-bar" role="tablist" aria-label="View"></div>
</header>

<div class="filter-bar" id="filter-bar">
  <div class="filter-swatches" id="filter-swatches" role="group" aria-label="Filter by material"></div>
  <button class="filter-clear" id="filter-clear" disabled>Clear</button>
</div>

<main id="panel" role="tabpanel"></main>

<div class="builder" id="builder" hidden></div>

<template id="builder-template">
  <div class="viewport"><canvas data-role="view" aria-label="Build view"></canvas></div>

  <div class="hud hud-top">
    <p class="brush" data-role="brush"></p>
    <button type="button" data-role="rotate" data-icon title="Rotate (R)"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 12a8 8 0 1 1-2.34-5.66"/><path d="M20 4v5h-5"/></svg></button>
    <button type="button" data-role="mirror" data-icon aria-pressed="false" title="Mirror (M)"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v18"/><path d="M8 8 4 12l4 4"/><path d="m16 8 4 4-4 4"/></svg></button>
    <span class="stepper">
      <button type="button" data-role="down" aria-label="Lower level">&minus;</button>
      <span class="level" data-role="level">0</span>
      <button type="button" data-role="up" aria-label="Raise level">+</button>
    </span>
    <button type="button" data-role="place" data-icon title="Place the aimed piece (Enter)" disabled><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m4 12 5 5L20 6"/></svg></button>
    <button type="button" data-role="remove" data-icon title="Remove the selected piece" disabled><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16"/><path d="M9 7V5h6v2"/><path d="M6 7l1 13h10l1-13"/></svg></button>
    <button type="button" data-role="undo" data-icon title="Undo" disabled><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9h11a5 5 0 0 1 0 10H8"/><path d="M4 9l4-4M4 9l4 4"/></svg></button>
    <button type="button" data-role="redo" data-icon title="Redo" disabled><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 9H9a5 5 0 0 0 0 10h7"/><path d="m20 9-4-4m4 4-4 4"/></svg></button>
    <button type="button" data-role="clear" data-icon title="Clear the board"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6 6 12 12M18 6 6 18"/></svg></button>
  </div>

  <div class="hud hud-save">
    <button type="button" data-role="save-json" title="Save the build as JSON">JSON</button>
    <button type="button" data-role="save-glb" title="Export the build as GLB">GLB</button>
    <label class="open" title="Open a saved build">
      Open<input type="file" data-role="open" accept="application/json,.json" hidden>
    </label>
  </div>

  <div class="hud hud-views">
    <button type="button" data-role="view-top" title="Top view">Top</button>
    <button type="button" data-role="view-iso" title="Angled view">Iso</button>
    <button type="button" data-role="view-front" title="Front view">Front</button>
    <span class="hud-split"></span>
    <button type="button" data-role="orbit-left" data-icon aria-label="Turn left"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 12a8 8 0 1 0 2.34-5.66"/><path d="M4 4v5h5"/></svg></button>
    <button type="button" data-role="orbit-right" data-icon aria-label="Turn right"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 12a8 8 0 1 1-2.34-5.66"/><path d="M20 4v5h-5"/></svg></button>
    <button type="button" data-role="zoom-in" data-icon aria-label="Zoom in"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6"/><path d="M11 8v6M8 11h6M20 20l-4.7-4.7"/></svg></button>
    <button type="button" data-role="zoom-out" data-icon aria-label="Zoom out"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6"/><path d="M8 11h6M20 20l-4.7-4.7"/></svg></button>
  </div>

  <ul class="legend">
    <li><i class="key mated"></i>mates</li>
    <li><i class="key partial"></i>part</li>
    <li><i class="key clash"></i>clashes</li>
    <li><i class="key open"></i>open</li>
  </ul>

  <div class="drawer" data-role="drawer">
    <div class="drawer-tabs" role="tablist">
      <button type="button" role="tab" data-role="tab-pieces" aria-selected="true">Pieces</button>
      <button type="button" role="tab" data-role="tab-seams" aria-selected="false">Seams</button>
    </div>

    <div class="drawer-body">
      <section class="palette" data-role="panel-pieces" role="tabpanel">
        <select data-role="family" aria-label="Filter pieces"></select>
        <ul class="palette-list" data-role="list"></ul>
      </section>

      <section class="inspect" data-role="panel-seams" role="tabpanel" hidden></section>
    </div>
  </div>
</template>

<p class="empty" id="empty" hidden>No models found.</p>

<dialog class="detail" id="detail">
  <button class="detail-close" id="detail-close" aria-label="Close">&times;</button>
  <div class="detail-viewer" id="detail-viewer"></div>
  <div class="detail-info">
    <h2 id="detail-name"></h2>
    <p class="detail-origin" id="detail-origin"></p>
    <div class="detail-traits" id="detail-traits"></div>
    <dl id="detail-data"></dl>
    <div class="detail-actions">
      <button id="detail-copy">Copy path</button>
      <button id="detail-select" aria-pressed="false">Add to selection</button>
      <a id="detail-download" download>Download .glb</a>
    </div>
  </div>
</dialog>

<div class="selection-bar" id="selection-bar" hidden>
  <span class="selection-count" id="selection-count" aria-live="polite"></span>
  <button type="button" id="select-visible">Select all visible</button>
  <button type="button" id="selection-copy" class="primary">Copy paths</button>
  <button type="button" id="select-clear">Clear</button>
</div>

<script type="importmap">
{ "imports": { "three": "./vendor/three/build/three.module.min.js" } }
</script>
<script src="vendor/model-viewer.min.js" type="module"></script>
<script src="catalog/catalog.js?v=3b6140ff39" type="module"></script>
</body>
</html>
